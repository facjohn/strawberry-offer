<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현농오퍼">
<meta name="theme-color" content="#16a368">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--sf2:#f1f3f8;--bd:#d8dce6;--bd2:#b5bbc9;--tx:#0d0f1f;--t2:#3d4257;--t3:#6c7286;--gr:#0f8a52;--rd:#b91c1c;--yw:#b06d00;--bl:#1e4ed8;--ac:#1e4ed8;--sh:0 1px 2px rgba(20,25,55,.04),0 2px 8px rgba(20,25,55,.04);--sh2:0 4px 16px rgba(20,25,55,.08);--sh3:0 12px 40px rgba(20,25,55,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:13px;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.mpos{color:var(--gr)!important}.mneg{color:var(--rd)!important}.mmid{color:var(--yw)!important}
.mono{font-family:'JetBrains Mono',monospace}

#land{position:fixed;inset:0;background:radial-gradient(ellipse at top,#fff 0%,#eef1f8 60%,#e6eaf4 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#land.h{opacity:0;pointer-events:none}
#land::before{content:"";position:absolute;top:18%;left:50%;transform:translateX(-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(59,111,240,.08),transparent 70%);pointer-events:none;filter:blur(20px)}
.lt{font-size:24px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#1a1a2e,#3b6ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;z-index:1}
.ls{font-size:11px;color:var(--t2);margin-top:-6px;letter-spacing:.05em;font-weight:500;position:relative;z-index:1}
.fcs{display:flex;gap:14px;position:relative;z-index:1;margin-top:6px}
.fc{width:104px;height:122px;border-radius:20px;border:1px solid var(--bd);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s,border-color .2s;box-shadow:var(--sh)}
.fc:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--bd2)}
.fc:active{transform:translateY(-1px) scale(.97)}
.fc .e{font-size:42px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
.fc .n{font-size:13px;font-weight:700;color:var(--tx);letter-spacing:-.01em}

.hd{position:sticky;top:0;z-index:100;padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);background:var(--sf);box-shadow:0 1px 0 rgba(20,25,55,.02)}
.hd h1{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hd-s{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.05em;margin-top:1px}
.bb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.bb:hover{background:var(--sf2);color:var(--tx);border-color:var(--bd2)}
.bb:active{transform:scale(.94)}

.bs{padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
.ig{flex:1;min-width:64px}
.ig label{font-size:10px;font-weight:800;color:var(--tx);display:block;margin-bottom:4px;letter-spacing:.02em}
.ig label em{font-style:normal;color:var(--ac);font-weight:800}
.ig input,.ig select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:6px 8px;border-radius:7px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
.ig input:hover,.ig select:hover{border-color:var(--bd2)}
.ig input:focus,.ig select:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}
.shtg{display:flex;gap:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px;overflow:hidden}
.sho{flex:1;background:transparent;border:none;color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;padding:6px 3px;border-radius:6px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;letter-spacing:-.02em;white-space:nowrap}
.sho:hover{color:var(--tx);background:rgba(0,0,0,.04)}
.sho.a{background:var(--ac);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 운송 모드별 고정 색 — 40ft=파랑, 20ft=청록, 항공=보라 (출고리스트 수량 배지와 동일 팔레트, 어느 과일이든 색만 봐도 모드 인지) */
.sho[id$="_40"].a{background:#1d4ed8}
.sho[id$="_20"].a{background:#0f766e}
.sho[id$="_air"].a{background:#7b2d8e}
/* 모드 스플래시 — 탭 진입/모드 전환 시 화면 중앙에 크게 떴다가 사라짐 (40↔20피트 착각 계산 방지) */
.modeSplash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9998;color:#fff;font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:900;letter-spacing:-.02em;padding:20px 36px;border-radius:24px;opacity:.92;pointer-events:none;display:flex;align-items:center;gap:14px;box-shadow:0 12px 44px rgba(0,0,0,.3);animation:msIn .18s ease-out;white-space:nowrap}
.modeSplash .msIc{font-size:40px}
.modeSplash .msSub{font-size:15px;font-weight:800;opacity:.85;font-family:'Noto Sans KR',sans-serif;align-self:flex-end;margin-bottom:8px}
.modeSplash.out{opacity:0;transition:opacity .4s ease-in}
@keyframes msIn{0%{transform:translate(-50%,-50%) scale(.82);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:.92}}

.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{padding:10px 12px;font-size:11px;font-weight:600;color:var(--t2);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;letter-spacing:-.01em}
.tb:hover{color:var(--tx)}
.tb.a{color:var(--tx);border-bottom-color:var(--ac);font-weight:700}
.lc{display:inline-block;background:var(--ac);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:10px;margin-left:4px;vertical-align:middle;min-width:14px;text-align:center}

.tp{display:none;padding:12px 14px;flex-direction:column;gap:10px}
.tp.a{display:flex}
.sl{font-size:11px;color:var(--tx);padding:10px 14px 0;font-weight:800;letter-spacing:-.01em}

.sjb{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.sj{padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;background:#fff;color:var(--t2);border:1px solid var(--bd);transition:all .18s}
.sj:hover{border-color:var(--bd2);color:var(--tx)}
.sj.a{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:transparent;font-weight:700}

.cc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.ch{padding:9px 12px;background:linear-gradient(180deg,var(--sf2),#fafbfd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:-.01em}
.sr{display:grid;grid-template-columns:1fr 78px 1fr 28px;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f2f7;transition:background .12s}
.sr:hover{background:#fafbfd}
.sr:last-of-type{border:none}
.slb{font-size:10px;font-weight:700;letter-spacing:-.01em}
.sbg{display:inline-block;font-size:7px;font-weight:800;padding:2px 5px;border-radius:4px;margin-left:3px;vertical-align:middle;letter-spacing:.02em}

.pi{width:60px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:5px;border-radius:6px;outline:none;text-align:center;transition:all .15s}
.pi:hover{border-color:var(--bd2)}
.pi:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}

.mv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right;letter-spacing:-.02em}
.mk{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;text-align:right;opacity:.85}

.lb{width:26px;height:26px;border-radius:6px;background:rgba(59,111,240,.07);border:1px solid rgba(59,111,240,.18);color:var(--bl);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.lb:hover{background:rgba(59,111,240,.13);transform:scale(1.05)}
.lb.ok{background:rgba(22,163,104,.15);border-color:var(--gr);color:var(--gr);animation:lp .35s cubic-bezier(.2,.9,.3,1.5)}
@keyframes lp{0%{transform:scale(1.4)}50%{transform:scale(.95)}100%{transform:scale(1)}}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
thead th{padding:9px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--tx);background:linear-gradient(180deg,#eef1f8,#dde2ed);border-bottom:1.5px solid var(--bd2);white-space:nowrap;letter-spacing:-.01em}
tbody td{padding:6px 4px;border-bottom:1px solid #f1f3f8;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.ctd{font-weight:800;text-align:center;background:linear-gradient(180deg,#fdf8ee,#fbf3df)!important;border-right:1px solid #d8c98c;vertical-align:middle;font-size:11px;color:#3d2a00;letter-spacing:-.01em}
.ptd input{width:60px;background:#fff;border:1px solid #d8c08c;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px;border-radius:5px;outline:none;text-align:center;transition:all .15s}
.ptd input::placeholder{color:#b8a06a;font-weight:500;opacity:.7}
.pi::placeholder{color:#b5b9c8;font-weight:500;opacity:.7}
.ptd input:hover{border-color:#c4a866}
.ptd input:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(59,111,240,.15)}
.mc{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;padding-right:6px!important;letter-spacing:-.02em}
.tc{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:10px;padding-right:6px!important;letter-spacing:-.01em;color:var(--tx)}
.cs td{border-bottom:2px solid #e8d5a3!important}

.pp{border:1px solid #ead9a8;border-radius:11px;padding:10px;margin-bottom:6px;background:linear-gradient(135deg,#fdf6e3,#fbf0d4);box-shadow:var(--sh)}
.pp h3{font-size:12px;font-weight:800;margin-bottom:8px;color:#7a5800;letter-spacing:-.01em}
.cv{background:#fff;border:1px solid #ead9a8;border-radius:8px;padding:8px 10px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f4ecd4;min-width:0}
.cr span:first-child{color:#5a4a20;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cvl{font-weight:800;font-family:'JetBrains Mono',monospace;color:#7a5800;font-size:11px;white-space:nowrap;margin-left:6px}

.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.wg .ig input{font-size:10px;padding:5px 6px}

.mo{position:fixed;inset:0;background:rgba(15,18,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fdIn .2s ease}
.mo.h{display:none}
@keyframes fdIn{from{opacity:0}to{opacity:1}}
.ml{background:var(--sf);border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:var(--sh3);animation:slUp .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.ml h3{font-size:14px;font-weight:800;margin-bottom:3px;letter-spacing:-.02em}
.msb{font-size:11px;color:var(--t2);margin-bottom:10px}
.mif{background:var(--sf2);border-radius:8px;padding:9px 10px;font-size:10px;margin-bottom:10px;line-height:1.8;font-family:'JetBrains Mono',monospace;border:1px solid var(--bd)}
.mif span{color:var(--tx);font-weight:700}
.ml label{font-size:9px;color:var(--t2);font-weight:700;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ml textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:11px;padding:8px;border-radius:7px;outline:none;resize:none;height:56px;transition:all .15s}
.ml textarea:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}
.mbs{display:flex;gap:7px;margin-top:10px}
.mb{flex:1;padding:10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;font-family:inherit;transition:all .15s;letter-spacing:-.01em}
.mb:active{transform:scale(.97)}
.mb.c{background:#fff;border-color:var(--bd);color:var(--t2)}
.mb.c:hover{background:var(--sf2);color:var(--tx)}
.mb.k{background:linear-gradient(135deg,rgba(22,163,104,.12),rgba(22,163,104,.06));border-color:var(--gr);color:var(--gr)}
.mb.k:hover{background:rgba(22,163,104,.18)}

.le{text-align:center;padding:36px 20px;color:var(--t3);font-size:12px;line-height:2}
.li{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.li:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.ld{font-size:8px;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.lps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sf2);border-radius:7px;padding:7px 8px;margin-top:6px;border:1px solid var(--bd)}
.lp label{font-size:7px;color:var(--t3);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.lp .v{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:-.02em}
.ldb{background:#fff;border:1px solid var(--bd);color:var(--t2);font-size:9px;padding:3px 8px;border-radius:5px;cursor:pointer;margin-top:6px;transition:all .15s}
.ldb:hover{background:var(--sf2);color:var(--rd);border-color:var(--rd)}
.cb{background:#fff;border:1px solid var(--bd);color:var(--t2);font-size:10px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
.cb:hover{background:var(--sf2);color:var(--rd);border-color:var(--rd)}

.ig input.upd{border-color:var(--gr)!important;animation:flG .8s ease-out}
@keyframes flG{0%{background:rgba(22,163,104,.18);box-shadow:0 0 0 3px rgba(22,163,104,.15)}100%{background:var(--bg);box-shadow:none}}

.sbdg{font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid;font-family:'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap;margin-left:auto;transition:all .2s;letter-spacing:.02em}
.sbdg:hover{transform:scale(1.03)}
.sbdg.ok{color:var(--gr);border-color:var(--gr);background:rgba(22,163,104,.06)}
.sbdg.err{color:var(--rd);border-color:var(--rd);background:rgba(214,59,59,.06)}
.sbdg.idle{color:var(--t2);border-color:var(--bd);background:#fff}
.sbdg.ld{color:var(--yw);border-color:var(--yw);background:rgba(212,138,0,.06);animation:blk 1s infinite}
.sbdg.warn{color:#c2860a;border-color:#c2860a;background:rgba(194,134,10,.08)}
.uptoast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-size:12px;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9999;display:flex;gap:10px;align-items:center}
.uptoast button{background:#16a368;border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:800;padding:6px 12px;border-radius:8px;cursor:pointer}
/* ── 출고리스트: 예정/지난 토글 + 컴팩트 행 ── */
.exvw{display:flex;gap:6px;margin-bottom:6px}
.exvb{flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-family:inherit;font-size:11px;font-weight:800;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.exvb.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.exvb .cnt{font-size:9px;font-weight:700;background:var(--sf2);color:var(--t3);padding:1px 7px;border-radius:8px}
.exvb.on .cnt{background:rgba(255,255,255,.22);color:#fff}
/* ── 출고리스트: 날짜 그룹 헤더 — 날짜가 한눈에 들어오게 크고 진하게, 그룹 사이는 여백+색띠로 명확히 분리 ── */
.exg{margin-top:14px}
.exg:first-child{margin-top:0}
.exgh{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,#edf2fd,#f8faff);padding:9px 13px;border-top:3px solid #3b6ff0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0;box-shadow:0 -1px 0 rgba(59,111,240,.15)}
.exgh.today{border-top-color:#e8334a;background:linear-gradient(135deg,#fdeef1,#fff8f9)}
.exgh.tmrw{border-top-color:#f97316;background:linear-gradient(135deg,#fef1e6,#fffaf5)}
.exgh.pastg{border-top-color:#b9bfce;background:linear-gradient(135deg,#f0f1f5,#f8f9fb)}
.exghD{font-size:16px;font-weight:900;color:#1a1a2e;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.exghD .wd{font-size:11px;font-weight:800;color:var(--t2)}
.exghD .gcnt{font-size:10px;font-weight:800;color:var(--t3);background:#fff;border:1px solid var(--bd);padding:1px 8px;border-radius:9px;align-self:center}
.exgh .dday{font-size:12px;font-weight:900;padding:3px 10px;border-radius:9px;background:#3b6ff0;color:#fff;font-family:'JetBrains Mono',monospace;letter-spacing:-.01em}
.exgh.today .dday{background:#e8334a}
.exgh.tmrw .dday{background:#f97316}
.exgh .dday.past{background:#e4e6ee;color:var(--t2)}
/* ── 카드: 품목·국가·산지(제조자)·인보이스가 메인, 수량(컨테이너)은 큰 배지 ── */
.exr{display:flex;align-items:stretch;gap:10px;padding:10px 13px;background:#fff;border-bottom:1px solid #eef0f5;min-width:0}
.exr:nth-child(even){background:#fcfcfe}
.exr:last-child{border-bottom:1px solid var(--bd);border-radius:0 0 12px 12px}
.exrIc{font-size:20px;flex-shrink:0;letter-spacing:-2px;white-space:nowrap;display:flex;align-items:center}
.exrTx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.exrT1{display:flex;gap:7px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.exrFr{font-weight:900;color:var(--tx);font-size:14.5px;flex-shrink:0;letter-spacing:-.02em}
.exrC{font-weight:800;color:var(--tx);font-size:13px;flex-shrink:0}
.exrMk{font-size:12px;font-weight:800;color:#7b2d8e;overflow:hidden;text-overflow:ellipsis;min-width:0}
.exrMk.none{color:#c2860a}
.exrT2{display:flex;gap:9px;align-items:center;font-size:10.5px;color:var(--t2);white-space:nowrap;overflow:hidden;min-width:0}
.exrT2>span{overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.exrBy{font-weight:700;color:#3b6ff0;flex-shrink:0}
.exrInv{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--tx);flex-shrink:0;display:inline-flex;align-items:center;gap:2px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
.exrCp{border:none;background:none;cursor:pointer;font-size:10px;padding:0 1px;flex-shrink:0}
.exrT3{display:flex;gap:9px;align-items:center;font-size:9.5px;color:var(--t3);white-space:nowrap;overflow:hidden;min-width:0}
.exrT3 .exrTl{font-family:'JetBrains Mono',monospace;flex-shrink:0}
.exrT3 .exrTl b{color:var(--t2);font-weight:700}
.exrSide{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px}
.exrQ{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:13.5px;letter-spacing:-.03em;padding:4px 10px;border-radius:9px;background:var(--sf);color:var(--t2);border:1px solid var(--bd);white-space:nowrap}
.exrQ.ft40{background:#e7edfd;color:#1d4ed8;border-color:#c4d3f8}
.exrQ.ft20{background:#e2f6f2;color:#0f766e;border-color:#bfe8e0}
.exrQ.air{background:#f5eafb;color:#7b2d8e;border-color:#e5cdf2}
.exrQ.none{background:none;border:none;color:var(--t3);font-weight:700}
.exrDn{border:1px solid var(--bd);background:#fff;color:var(--t3);border-radius:8px;font-size:9.5px;font-weight:800;padding:3px 9px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.exrDn:hover{border-color:var(--gr);color:var(--gr)}
.exrDn.undo:hover{border-color:#3b6ff0;color:#3b6ff0}
@media (max-width:420px){.exrT2,.exrT3{flex-wrap:wrap;white-space:normal}.exrFr{font-size:13.5px}.exrQ{font-size:12px}}
/* ── 지난 오퍼가 힌트 ── */
.lof{font-size:8px;color:var(--t3);cursor:pointer;margin-top:1px;white-space:nowrap;line-height:1.2;text-align:center}
.lof b{color:#3b6ff0;font-weight:800}
/* ── CIF 원가 팝오버 ── */
.cifl{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:5px 2px;border-bottom:1px dashed var(--bd)}
.cifl b{font-family:'JetBrains Mono',monospace;font-weight:700}
.cifl.tot{border-bottom:none;border-top:2px solid var(--tx);margin-top:4px;padding-top:8px;font-weight:800}
.mc,.mv{cursor:pointer}
/* ── 국가 열 고정 (가로 스크롤 시) ── */
#to th:first-child{position:sticky;left:0;z-index:3;background:var(--sf,#f3f4f8)}
#to td.ctd,#to td.gctry{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 4px -2px rgba(0,0,0,.08)}
/* 추천(★best) 행의 반투명 그라데이션이 고정 셀을 투명하게 만들어 스크롤 시 뒤 내용이 비치는 것 방지 — 불투명 배경으로 재지정 */
#to tr.best td.ctd,#to tr.best td.gctry{background:linear-gradient(90deg,#e5f4ec,#f7fbf9)!important}
/* ── 국가별 견적 복사 버튼 ── */
.qcopy{border:1px solid var(--bd);background:#fff;border-radius:6px;font-size:8.5px;font-weight:700;color:var(--t2);padding:2px 6px;cursor:pointer;font-family:inherit;margin-top:3px}
.qcopy:hover{border-color:#3b6ff0;color:#3b6ff0}
/* 커스텀 내륙운임 선택 버튼 (시트 동기화 값) */
.cinOpt{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 11px;font-family:inherit;font-size:11px;font-weight:700;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;transition:all .15s}
.cinOpt b{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#0e7490}
.cinOpt:hover{border-color:#0e7490;box-shadow:0 2px 8px rgba(14,116,144,.12)}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.5}}
.lst{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace;text-align:right;margin-top:3px;letter-spacing:.02em}
.sgd-hint{font-size:9px;color:#c47d00;margin-top:4px;display:flex;align-items:center;gap:5px;font-weight:600}
.fxhint{font-size:9px;color:var(--t3);margin-top:3px;font-family:'JetBrains Mono',monospace;letter-spacing:.02em;min-height:11px}
.dot-sgd{width:6px;height:6px;border-radius:50%;background:#c47d00;animation:pls 2s infinite;flex-shrink:0;box-shadow:0 0 0 2px rgba(196,125,0,.2)}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

.pwo{position:fixed;inset:0;background:radial-gradient(ellipse at center,#fff 0%,#eef1f8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:30px}
.pwo.h{display:none}
.pwb{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:36px 30px;width:100%;max-width:310px;text-align:center;box-shadow:var(--sh3)}
.pwi{width:100%;background:var(--bg);border:2px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;padding:14px;border-radius:12px;outline:none;text-align:center;letter-spacing:8px;margin-bottom:14px;transition:all .15s}
.pwi:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(59,111,240,.12)}
.pwi.shake{animation:shk .35s ease-out}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pwbtn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#3b6ff0,#2855d4);border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:-.01em;box-shadow:0 4px 14px rgba(59,111,240,.3);transition:all .15s}
.pwbtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,111,240,.4)}
.pwbtn:active{transform:translateY(0) scale(.98)}
.mfg{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.mr{display:flex;gap:7px}
.mfi{flex:1;min-width:0}
.mfi label{font-size:9px;color:var(--t2);font-weight:700;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.mfi input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-size:11px;font-weight:600;padding:7px 8px;border-radius:6px;outline:none;font-family:inherit;transition:all .15s}
.mfi input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}
.mfi input.auto{background:#f7faff;border-color:#cfdcf5;color:#2855d4;font-family:'JetBrains Mono',monospace;font-size:10px}
.mb.s{background:linear-gradient(135deg,#3b6ff0,#2855d4);border-color:#2855d4;color:#fff;box-shadow:0 3px 12px rgba(59,111,240,.28)}
.mb.s:hover{box-shadow:0 5px 16px rgba(59,111,240,.4);transform:translateY(-1px)}
.mb.s:disabled{background:#c5cad8;border-color:#c5cad8;box-shadow:none;cursor:not-allowed;transform:none}
.mbs{flex-wrap:wrap}
.mbs .mb{flex:1 1 calc(50% - 4px);min-width:0}
.snt{display:inline-block;font-size:8px;font-weight:800;color:var(--gr);background:rgba(22,163,104,.12);border:1px solid var(--gr);padding:1px 6px;border-radius:8px;margin-left:5px;vertical-align:middle;letter-spacing:.04em}

let _msT=null,_msT2=null;
function showModeSplash(v,keepN,keepPfx){
  const cfg={'40':['🚢','40FT','#1d4ed8','해운 컨테이너'],'20':['🚢','20FT','#0f766e','해운 컨테이너'],'air':['✈️','AIR','#7b2d8e','항공']}[String(v)];
  if(!cfg)return;
  const old=document.getElementById('modeSplash');if(old)old.remove();
  const e=document.createElement('div');e.id='modeSplash';e.className='modeSplash';
  e.style.background=cfg[2];
  e.innerHTML='<span class="msIc">'+cfg[0]+'</span>'+cfg[1]+'<span class="msSub">'+cfg[3]+'</span>'
    +(keepN>0?'<span style="display:block;font-size:11px;font-weight:700;margin-top:7px;opacity:.92">💲 입력된 오퍼가 '+keepN+'건 유지 · 탭하면 비우기</span>':'');
  document.body.appendChild(e);
  // 40↔20 전환 시 이전 모드에서 입력한 오퍼가($)가 유지됨을 알리고, 스플래시 탭 한 번으로 비울 수 있게 — 다른 모드 기준 $가 조용히 섞여 기록·견적에 들어가는 실수 방지
  if(keepN>0&&keepPfx){e.style.cursor='pointer';e.onclick=function(){clearInpPrefix([keepPfx]);e.remove();
    const tt=document.createElement('div');tt.className='uptoast';tt.textContent='💲 오퍼가 '+keepN+'건 비움';document.body.appendChild(tt);setTimeout(()=>{if(tt.parentNode)tt.parentNode.removeChild(tt);},2000);
    if(F==='p')pB();else if(F==='g')gB();else if(F==='c')cB();};}
  clearTimeout(_msT);clearTimeout(_msT2);
  _msT=setTimeout(()=>{e.classList.add('out');_msT2=setTimeout(()=>{if(e.parentNode)e.remove();},450);},keepN>0?2600:1000);
}
// 접두사로 저장값+입력칸 일괄 초기화 — setSh 모드 전환·스플래시 '오퍼가 비우기' 공용
function clearInpPrefix(prefixes){
  try{const st=JSON.parse(localStorage.getItem(INP_KEY)||'{}');Object.keys(st).forEach(k=>{if(prefixes.some(p=>k.slice(0,p.length)===p))delete st[k];});localStorage.setItem(INP_KEY,JSON.stringify(st));}catch(e){}
  prefixes.forEach(p=>document.querySelectorAll('input[id^="'+p+'"]').forEach(el=>el.value=''));
}
function setSh(id,v){const h=$(id);if(!h||h.value===v)return;const prev=h.value;h.value=v;['40','20','air'].forEach(k=>{const b=$(id+'_'+k);if(b)b.classList.toggle('a',v===k);});
  // 운송 모드 전환 시 실출고 초기화 (모드별 만적 용량이 달라 값이 새면 계산이 왜곡됨) — 포도(gq)·배(pq) 공통
  const clearPrefixes=[];
  if(id==='gsh'){clearPrefixes.push('gq');if(prev==='air'||v==='air')clearPrefixes.push('go');}   // 해운↔항공 전환은 오퍼가($)도 초기화 (운임 구조가 달라 이전 오퍼가가 무의미)
  if(id==='psh')clearPrefixes.push('pq');
  if(id==='csh'){clearPrefixes.push('cq');if(prev==='air'||v==='air')clearPrefixes.push('cof');}   // 커스텀도 포도와 동일 규칙
  if(clearPrefixes.length)clearInpPrefix(clearPrefixes);
  // 40↔20 전환에서 유지되는 오퍼가($) 건수 집계 → 스플래시에 안내 (해운↔항공은 위에서 이미 초기화됨)
  let keepPfx=null;
  if(id==='psh')keepPfx='po';
  else if(id==='gsh'&&prev!=='air'&&v!=='air')keepPfx='go';
  let keepN=0;
  if(keepPfx){try{const st2=JSON.parse(localStorage.getItem(INP_KEY)||'{}');keepN=Object.keys(st2).filter(k=>k.slice(0,keepPfx.length)===keepPfx&&st2[k]!=='').length;}catch(e){}}
  inpSaveAll();if(id==='psh')pB();else if(id==='gsh')gB();else if(id==='csh')cB();else if(id==='msh')mB();
  showModeSplash(v,keepN,keepPfx);}   // 모드 전환 즉시 화면 중앙에 크게 표시

function sCalc(k,i){
  const p0=gv('sp0'),p1=gv('sp1'),fx=gv('sfx'),sg=gv('ssg'),sp=SS[i],fd=SF[k];
  if(!((sp.pk===0?p0:p1)>0))return null;   // kg단가 공란/0이면 원물 0원으로 CIF 과소·마진 과대 초록 표시 — 배 탭과 동일하게 계산 차단('-')
  const mat=(sp.pk===0?p0:p1)*sp.nw,pb=(fd.d/sp.ct)+sp.gw*(fd.a+fd.fc),cif=mat+sp.bj+pb;
  const rt=fd.sg?sg:fx;
  const be=rt?cif/rt:0;
  const of=gv('so'+k+i);
  const sym=fd.sg?'S$':'$';
  if(!of||!rt)return{empty:true,be,cif,rt,sp,fd,sym,mat,pb};   // 환율 0이면 마진 -Infinity → 차단
  const mb=of-cif/rt,tk=mb*rt*sp.ct;
  return{of,mb,tk,cif,rt,sp,fd,be,sym,mat,pb};
}
function sR(k,i){

}

}

function pcRaw(sid,f){const o=pCost[sid]||{};return(o[f]!=null&&o[f]!=='')?o[f]:'';}
function pcVal(sp,f){const o=pCost[sp.id]||{};if(o[f]!=null&&o[f]!=='')return +o[f];return +sp[f]||0;}
function pcOn(sid){const o=pCost[sid]||{};return o.bj!=null||o.bx!=null;}

}

function pCalc(cn,sid){

    u3a:gv('puwk_u3a')||PUWK.u3a,u3b:gv('puwk_u3b')||PUWK.u3b,

  }

    raw=sp.rf(p);if(!(raw>0))return null;   // 단가 공란/0이면 원물 0원으로 마진 과대 표시되던 문제 — 미국 경로와 동일하게 차단('-')

function gCalc(cn,si){
  if(!gSj)return null;
  const sp=GS[si];if(!sp)return null;
  const fx=gv('gfx'),sup=gv('gsp');
  const shv=$('gsh')?$('gsh').value:'40';
  const isAir=shv==='air';
  const sh=isAir?'air':(shv==='40'?'f':'t');
  // 산지+스펙 비용 (인라인 입력, 미입력 시 기본값)
  const ctp=gcVal(si,'ctp')||sp.ct||1;
  const raw=gcVal(si,'raw'),wk=gcVal(si,'wk'),buja=gcVal(si,'bj'),box=gcVal(si,'bx');
  const qIn=gv('gq'+cn+si);
  let pbf,defTb,tb;
  if(isAir){
    const airKg=GAIR_KG[cn]||0;
    if(!airKg)return null;
    defTb=ctp;
    tb=qIn>0?qIn:defTb;
    var gdom=(GAIR_DOM_C[cn]!=null)?GAIR_DOM_C[cn]:GAIR_DOM;
    pbf=airKg*sp.gw + gdom/Math.max(tb,1);    // 항공: 박스당운임 = G.W×운임계(₩/kg) + 도내운송÷실출고 (도내운송 국가별)
  } else {
    const sea=GSEA[cn],il=GIL[gSj];
    if(!sea||!il)return null;
    const seaV=sea[sh],inlV=il[sh];
    if(!seaV||!inlV)return null;   // 내륙운임 0(미수신/신규산지)이면 CIF 과소계산 → 계산 차단
    const tp=sh==='f'?(sp.tp4>0?sp.tp4:20):(sp.tp2>0?sp.tp2:9);   // 파레트 수: 시트 K열(TP) sync값 우선, 미수신 시 종전 하드코딩(40ft=20/20ft=9)
    defTb=ctp*tp;
    tb=qIn>0?qIn:defTb;                           // 실출고 미입력 시 만적(cnt/p×TP)
    pbf=(inlV+seaV)/tp/ctp;                        // 해운: 박스당운임 = (내륙+해운)÷(TP×cnt/p)
  }
  const cif=raw+wk+buja+box+pbf;
  const be=fx?cif/fx:0;
  const of=gv('go'+cn+si);
  if(!of||!fx)return{empty:true,be,cif,tb,defTb,raw,wk,buja,box,pbf,ctp};   // 환율 0이면 마진 -Infinity → 차단
  const mb=of-(cif/fx),tk=mb*tb*fx+tb*sp.nw*sup;   // 원화 총마진 = 박스당마진×실출고 + 지원(₩/kg)×N.W×실출고
  return{of,raw,wk,buja,box,pbf,mb,tk,tkUsd:fx?tk/fx:0,cif,tb,defTb,be,ctp};
}

// 새 품목(복숭아 등)을 즉석에서 오퍼: 아이템명·제원(원물/작업비/부자재/박스/NW/GW/박스수)을 직접 입력하고
// 운임은 기존 국가별 데이터 재사용 — 해운=DATA 40/20ft 표(GSEA, 부족분 PSEA 폴백), 항공=DATA 일반(냉장) 요율(GAIR_KG).
// 계산 규칙은 귤/키위/감과 동일: CIF=원물+작업비+부자재+박스+박스당물류, 마진$=오퍼가-CIF/환율, 총마진₩=마진×실출고×환율+지원(₩/kg)×NW×실출고.
const C_SEA_ORDER=['대만','베트남호치민','베트남하이퐁','홍콩','말레이시아','인도네시아','태국','싱가폴','호주','미국LA','미국NY','캐나다'];
function cSeaVal(cn,leg){
  if(GSEA[cn]&&GSEA[cn][leg]>0)return GSEA[cn][leg];
  if(PSEA[cn]&&PSEA[cn][leg]>0)return PSEA[cn][leg];
  if(cn==='베트남호치민'&&PSEA['베트남']&&PSEA['베트남'][leg]>0)return PSEA['베트남'][leg];   // 배 해운의 일반 '베트남'=호치민
  if(cn==='호주'&&PSEA['호주']&&PSEA['호주'][leg]>0)return PSEA['호주'][leg];
  return 0;
}
function cCountries(){
  const shv=$('csh')?$('csh').value:'40';
  if(shv==='air')return Object.keys(GAIR_KG).filter(k=>+GAIR_KG[k]>0);
  const leg=shv==='40'?'f':'t';
  return C_SEA_ORDER.filter(cn=>cSeaVal(cn,leg)>0&&!(leg==='t'&&NO20[cn]));   // 20ft 없는 국가는 시트 오염이 와도 미노출 (전역 NO20)
}

function cCalc(cn){
  const fx=gv('cfx');
  const shv=$('csh')?$('csh').value:'40';
  const air=shv==='air';
  const nw=gv('cnw')||1,gw=gv('cgw')||nw,ct=gv('cct')||1;
  const raw=gv('craw'),wk=gv('cwk'),bj=gv('cbj'),bx=gv('cbx'),sup=gv('csp');
  let defTb,pbf;
  if(air){
    const rate=+GAIR_KG[cn];if(!(rate>0))return null;
    defTb=ct;   // 항공은 팔레트 1개 기준 — 실출고 입력 시 그 수량으로 국내운송 분배 (포도 항공과 동일)
    const tb0=gv('cq'+cn)||defTb;if(!(tb0>0))return null;
    pbf=rate*gw+(gv('cdm')||0)/tb0;
  }else{
    const seaV=cSeaVal(cn,shv==='40'?'f':'t');if(!(seaV>0))return null;
    const tp=shv==='40'?20:9;defTb=ct*tp;
    const tb0=gv('cq'+cn)||defTb;if(!(tb0>0))return null;
    pbf=(seaV+(gv('cin')||0))/tb0;
  }
  const tb=gv('cq'+cn)||defTb;
  const cif=raw+wk+bj+bx+pbf;
  const be=fx?cif/fx:0;
  const of=gv('cof'+cn);
  if(!of||!fx||!raw)return{empty:true,be,cif,tb,defTb,raw,wk,bj,bx,pbf};   // 환율/원물 미입력이면 계산 차단 — 과대 마진 방지
  const mb=of-(cif/fx),tk=mb*tb*fx+tb*nw*sup;
  return{of,raw,wk,bj,bx,mb,tk,cif,tb,defTb,be,pbf};
}
function cR(cn){

}

const FRN={s:'딸기',p:'배',g:'포도',o:'귤',k:'키위',h:'감',c:'커스텀'};
const FR_CODE={'딸기':'s','배':'p','포도':'g','귤':'o','키위':'k','감':'h'};
// 시트에서 온 상차일을 앱 표준(yyyy-MM-dd)으로 정규화 — 구버전 GAS의 'M/d' 응답도 기록일 연도 기준으로 복원
function normLoadDate(v,ref){
  if(!v)return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){
    let y=new Date().getFullYear();const rd=ref?new Date(ref):null;
    if(rd&&!isNaN(rd.getTime())){
      y=rd.getFullYear();
      // 상차일은 기록일보다 과거일 수 없음(보통 근미래) — 12월 기록의 1월 상차일은 이듬해로 보정
      const cand=new Date(y,+m[1]-1,+m[2]);
      if(cand.getTime()-rd.getTime()<-90*86400000)y+=1;
    }
    return y+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
  }
  return s;
}
// 바이어단가 문자열('$12.5','S$8','$1,234') → {sym,of} 분리. 콤마는 천단위 구분자로 취급(한국 운영 기준)
function parseBuyerPrice(s){
  const m=String(s==null?'':s).trim().match(/^([^\d\-+]*)([\-+]?[\d,]+(?:\.\d+)?)/);
  if(!m)return null;
  const of=parseFloat(m[2].replace(/,/g,''));
  if(isNaN(of))return null;
  return{sym:(m[1].trim()||'$'),of};
}

// ═══ 지난 오퍼가 힌트 — 같은 과일·국가·스펙(+운송모드)의 최근 기록 오퍼가를 $ 입력칸 밑에 표시 (탭하면 채움) ═══
function lastOffer(fr,co,spl,sh){
  let best=null;const coC=cano(co);
  for(const l of logs){
    if(l.fr!==fr||cano(l.co)!==coC||l.sp!==spl||l.of==null||l.of==='')continue;   // 국가 개명 후에도 옛 이름 기록과 매칭 (cano)
    if(sh&&l.sh&&l.sh!==sh)continue;   // 운송모드가 다른 기록 제외 — 항공 오퍼가가 해운 행에 뜨거나 40ft에 20ft 가격이 주입되지 않게
    const t=l.dt?Date.parse(l.dt):0;
    if(!best||t>best.t)best={of:l.of,sym:l.sym||'$',t,sh:l.sh||''};
  }
  return best;
}
// 지난 오퍼 최근 3건 — CIF 팝오버 하단에 짧은 가격 추세 표시 (lastOffer와 동일 필터: 과일·국가·스펙·운송모드)
function offerHist(fr,co,spl,sh,n){
  const hits=[];const coC=cano(co);
  for(const l of logs){
    if(l.fr!==fr||cano(l.co)!==coC||l.sp!==spl||l.of==null||l.of==='')continue;
    if(sh&&l.sh&&l.sh!==sh)continue;
    hits.push({of:l.of,sym:l.sym||'$',t:l.dt?Date.parse(l.dt):0,sh:l.sh||''});
  }
  hits.sort((a,b)=>b.t-a.t);
  return hits.slice(0,n||3);
}
function offerHistRows(fr,co,spl,sh){
  const hs=offerHist(fr,co,spl,sh,3);
  if(!hs.length)return[];
  return[['지난 오퍼','','tot']].concat(hs.map(x=>{
    const d=x.t?new Date(x.t):null;
    const when=(d&&!isNaN(d.getTime()))?(d.getMonth()+1)+'/'+d.getDate():'';
    return[hlEsc(when+(x.sh?' · '+x.sh:'')),hlEsc(x.sym+x.of)];
  }));
}
function lofR(lofId,inpId,fr,co,spl,recalc,sh){
  const lo=$(lofId);if(!lo)return;
  const b=lastOffer(fr,co,spl,sh);
  if(!b){if(lo.innerHTML)lo.innerHTML='';lo.onclick=null;return;}
  const d=b.t?new Date(b.t):null;
  lo.innerHTML='↩ 지난 <b>'+hlEsc(String(b.sym)+String(b.of))+'</b>'+(d&&!isNaN(d.getTime())?'<span style="opacity:.7"> '+(d.getMonth()+1)+'/'+d.getDate()+'</span>':'')   // sym/of는 시트 왕복 텍스트 — 이스케이프(저장형 XSS 방지)
    +(sh&&!b.sh?'<span style="opacity:.55"> 모드?</span>':'');   // 모드 미상(구버전 시트 왕복) 기록은 표시로 구분
  lo.title='탭하면 이 값으로 채움'+(sh&&!b.sh?' (기록 당시 운송모드 미상 — 확인 후 사용)':'');
  lo.onclick=()=>{const e=$(inpId);if(e){e.value=b.of;recalc();inpSaveAll();}};
}

// ═══ 국가별 일괄 견적 복사 — 한 국가에 입력된 전 스펙 오퍼를 견적 텍스트로 ═══
function copyQuote(cn){
  const sh0=syncStaleHours();
  if(sh0&&!confirm('⚠ 시트 동기화가 '+sh0+'시간 전입니다.\n운임·단가가 낡았을 수 있습니다 — 동기화(⟳) 후 복사를 권장합니다.\n\n그래도 지금 견적을 복사할까요?'))return;
  const st=inpStore();
  const sv=id=>{const e=$(id);if(e)return +e.value||0;return +(st[id]||0)||0;};
  const now=new Date();const ds=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const lines=[];let head='';
  if(F==='s'){
    const fd=SF[cn];if(!fd)return;
    head='🍓 딸기 · '+fd.f+' '+fd.n+' · '+ds;
    SS.forEach((sp,i)=>{const of=sv('so'+cn+i);if(of)lines.push('- '+sp.l+': '+(fd.sg?'S$':'$')+of);});
    lines.push('','적용환율 '+(fd.sg?'SGD ₩'+fN(sv('ssg')):'₩'+fN(sv('sfx'))+'/$'));
  }else if(F==='p'){
    const co=PC.find(c=>c.n===cn);
    const shp=($('psh')?$('psh').value:'40');
    head='🍐 배 · '+(co?co.f+' ':'')+cn+(pSj?' · '+pSj:'')+' · '+shp+'ft · '+ds;
    // 현재 운송모드에 표시되는 스펙만 포함(pB와 동일 필터) — 다른 모드에서 입력한 저장값이 헤더와 다른 기준의 가격으로 견적에 섞이지 않게
    PS.filter(s=>(shp==='40'?s.c4:s.c2)&&!(co&&co.us&&s.noUS)).forEach(s=>{const of=sv('po'+cn+s.id);if(of){const q=sv('pq'+cn+s.id);lines.push('- '+s.l+': $'+of+(q?' ('+fN(q)+'박스)':''));}});
    lines.push('','적용환율 ₩'+fN(sv('pfx'))+'/$');
  }else if(F==='g'){
    const shv=$('gsh')?$('gsh').value:'40';
    const cl=(shv==='air')?GAIR_C:GC;const co=cl.find(c=>c.n===cn);
    head='🍇 포도 · '+(co?co.f+' ':'')+cn+(gSj?' · '+gSj:'')+' · '+(shv==='air'?'항공':shv+'ft')+' · '+ds;
    GS.forEach((s,i)=>{const of=sv('go'+cn+i);if(of){const q=sv('gq'+cn+i);lines.push('- '+s.l+': $'+of+(q?' ('+fN(q)+'박스)':''));}});
    lines.push('','적용환율 ₩'+fN(sv('gfx'))+'/$');
  }else if(F==='c'){
    const shv=$('csh')?$('csh').value:'40';
    head='✨ '+cName()+' · '+exFlag(cn)+' '+cn+' · '+(shv==='air'?'항공':shv+'ft')+' · '+ds;
    const of=sv('cof'+cn);if(of){const q=sv('cq'+cn);lines.push('- '+cName()+': $'+of+(q?' ('+fN(q)+'박스)':''));}
    lines.push('','적용환율 ₩'+fN(sv('cfx'))+'/$');
  }else{
    const d=MFD[F];if(!d)return;const co=PC.find(c=>c.n===cn);
    head=(F==='o'?'🍊':F==='k'?'🥝':'🟠')+' '+MFN[F]+' · '+(co?co.f+' ':'')+cn+(mSj[F]?' · '+mSj[F]:'')+' · '+($('msh')?$('msh').value:'40')+'ft · '+ds;
    d.specs.forEach((sp,i)=>{const of=sv('mo'+F+cn+i);if(of)lines.push('- '+sp.l+': $'+of);});
    lines.push('','적용환율 ₩'+fN(sv('mfx'))+'/$');
  }
  if(!lines.some(l=>l.indexOf('- ')===0)){alert(cn+'에 입력된 오퍼가가 없습니다');return;}
  const txt='[현농프레쉬 오퍼]\n'+head+'\n'+lines.join('\n');
  const toast=m=>{const t=document.createElement('div');t.className='uptoast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},2000);};
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 '+cn+' 견적 복사됨');}catch(e){alert(txt);}};
  recordQuoteCopy((F==='s'&&SF[cn]&&SF[cn].n)?SF[cn].n:cn);   // 복사 시각 기록 — 딸기는 SF 키가 아닌 표시 국가명으로 (기록 co와 일치해야 미기록 감지가 해제됨)
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('📋 '+cn+' 견적 복사됨')).catch(fb);else fb();
}
// ━━━ 입력값 자동 저장/복원 ━━━
const INP_KEY='hn_inp_v1';
let _inpSaveT=null;
function inpStore(){try{return JSON.parse(localStorage.getItem(INP_KEY)||'{}');}catch(e){return{};}}
function inpSet(id,val){const s=inpStore();if(val===''||val==null)delete s[id];else s[id]=String(val);inpPersist(s);}
function inpRestore(){
  const s=inpStore();
  document.querySelectorAll('input[id],select[id]').forEach(el=>{
    if(INP_EXCLUDE.includes(el.id))return;   // 제외 목록은 복원도 금지 — 과거 버전이 저장해둔 뷰어 검색어 등이 계속 살아나는 것 방지
    if(s[el.id]!=null&&s[el.id]!=='')el.value=s[el.id];
  });
  ['psh','gsh','msh','csh'].forEach(id=>{const h=$(id);if(!h)return;const v=h.value;['40','20','air'].forEach(k=>{const b=$(id+'_'+k);if(b)b.classList.toggle('a',v===k);});});
}
const INP_EXCLUDE=['pwi','mm','finv','fmkr','fld','fqty','ffx','fof','fraw','gbmWk','gbmBj','gbmBx','elvS','hlvS','elvDF','elvDT'];   // 모달/비밀번호/뷰어 검색·필터 입력은 자동저장 제외 (뷰어 필터 상태와 어긋난 검색어가 복원되는 것 방지)
// 과거 버전이 저장해둔 제외 대상 키를 1회 정리 — 이미 검색어가 저장된 기기에서 증상이 계속되는 것 방지
try{const s0=inpStore();let d0=false;INP_EXCLUDE.forEach(k=>{if(k in s0){delete s0[k];d0=true;}});if(d0)localStorage.setItem(INP_KEY,JSON.stringify(s0));}catch(e){}
// 미국 작업비 저장키 1회 정리(v30) — 구버전 sync가 저장해둔 오염값(u12=3팩값 9500 등, 2026-07-28 감사)이 새 필드(동일 id)로 복원되는 것 방지. 새 기본값=시트 실측이라 정리가 곧 교정.
try{if(!localStorage.getItem('hn_puwk_mig1')){const s1=inpStore();let d1=false;Object.keys(s1).forEach(k=>{if(k.indexOf('puwk_')===0&&k!=='puwk_udg'){delete s1[k];d1=true;}});if(d1)localStorage.setItem(INP_KEY,JSON.stringify(s1));localStorage.setItem('hn_puwk_mig1','1');}}catch(e){}   // udg(대과)는 수동 전용이라 삭제 시 복구 원천이 없음 — 보존
let _stPushing=false;   // pushState→inpSaveAll 재귀로 무한 타이머가 걸리지 않게
let _inpSaveWarned=false;
// 저장 실패 시 무음 금지: 가장 큰 항목(동기화 스냅샷)을 비워 1회 재시도, 그래도 실패하면 세션당 1회 경고 (gcSet/saveL과 동일 정책)
function inpPersist(s){
  try{localStorage.setItem(INP_KEY,JSON.stringify(s));}
  catch(e){
    try{localStorage.removeItem('hn_sync_v2');localStorage.setItem(INP_KEY,JSON.stringify(s));}
    catch(e2){if(!_inpSaveWarned){_inpSaveWarned=true;alert('⚠ 저장공간이 부족해 입력값이 저장되지 않습니다. 오래된 기록을 정리해주세요.');}}
  }
}
function inpSaveAll(){
  const s=inpStore();   // ★ 병합 저장 — 현재 화면에 없는 다른 과일 탭의 저장값을 지우지 않음
  document.querySelectorAll('input[id],select[id]').forEach(el=>{
    if(!el.id||INP_EXCLUDE.includes(el.id))return;
    if(el.value==='')delete s[el.id];else s[el.id]=el.value;

  inpPersist(s);

function cmOpen(d,sub,info){
  pnd={...d,id:genId(),dt:new Date().toISOString(),me:''};   // genId=타임스탬프+랜덤 — 기기 간 동시 저장 id 충돌 방지
  $('msb').textContent=sub;$('mif').innerHTML=info;$('mm').value='';
  $('finv').value='';
  $('fmkr').value=d.maker||d.sj||'';
  $('fld').value='';$('fldDisp').textContent='';
  $('fqty').value=d.qty||'';
  $('ffx').value=d.rt?(d.rt+(d.fr==='s'&&d.sym==='S$'?' SGD':' ₩/$')):'';
  $('fof').value=(d.of!=null&&d.of!=='')?((d.sym||'$')+d.of):'';$('fof').readOnly=true;   // 신규 기록: 계산기 값 고정(수정은 편집 화면에서)
  $('fraw').value=d.raw||'';
  const ok=$('mokbtn');if(ok)ok.style.display='';
  $('mo').classList.remove('h');
  const b=$('msbtn');b.disabled=false;b.textContent='📤 시트 전송';
}
function cmClose(){$('mo').classList.add('h');pnd=null;}
function fmtKDate(v){if(!v)return '';if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(v+'T00:00:00');if(isNaN(d))return v;const days=['일','월','화','수','목','금','토'];return `${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;}
function updFld(){const v=$('fld').value;const disp=$('fldDisp');if(disp)disp.textContent=v?fmtKDate(v):'';}
function cmFill(){
  if(!pnd)return;
  pnd.me=$('mm').value.trim().slice(0,500);   // 메모 500자 제한 — JSONP GET URL 길이 초과로 전송 실패하는 것 방지
  pnd.invoice=$('finv').value.trim();
  pnd.maker=$('fmkr').value.trim();
  pnd.loadDate=$('fld').value.trim();
  pnd.qty=$('fqty').value.trim();
  pnd.raw=$('fraw').value.trim();
  const fofV=$('fof')?$('fof').value:'';
  const bp=parseBuyerPrice(fofV);   // 수정 화면에서 고친 바이어단가 반영
  if(bp){
    // 수정 화면에서 단가가 바뀌면 기존 마진(mb/tk)은 옛 단가 기준이라 무효 — null 처리하고 시트 J열도 비우도록 플래그 (새 단가+옛 마진 조합이 시트에 남는 것 방지)
    if(pnd._edit&&pnd.of!=null&&String(pnd.of)!==String(bp.of)){pnd.mb=null;pnd.tk=null;pnd._mstale=true;}
    pnd.sym=bp.sym;pnd.of=bp.of;
  }else if(pnd._edit&&fofV.trim()!==''){alert('바이어단가를 해석할 수 없습니다: "'+fofV+'" — 기존 값('+(pnd.sym||'$')+(pnd.of!=null?pnd.of:'-')+')이 유지됩니다');}
}
function cmOk(){if(!pnd)return;cmFill();logs=logs.filter(l=>String(l.id)!==String(pnd.id));logs.unshift({...pnd});saveL();const b=$(pnd.btn);if(b){b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1000);}cmClose();rL();}   // 같은 id는 항상 1장 — 전송 타임아웃(queueLocal) 후 💾 로컬을 눌러도 중복 편입되지 않게
function cmCopy(){if(!pnd)return;cmFill();
  const t=`인보이스: ${pnd.invoice||'-'}\n제조자: ${pnd.maker||'-'}\n상차일: ${fmtKDate(pnd.loadDate)||'-'}\n수량: ${pnd.qty||'-'}\n적용환율: ${pnd.rt||'-'}\n바이어단가: ${pnd.sym}${pnd.of}\n산지단가: ${pnd.raw||'-'}\n──────────\n${pnd.co} ${pnd.sp||''}\n마진: ${fD(pnd.mb)}${pnd.sym}/box · 총 ${fK(pnd.tk)}${pnd.sj?' ('+pnd.sj+')':''}${pnd.sh?' '+pnd.sh:''}${pnd.me?'\n메모: '+pnd.me:''}`;
  // 복사 실패도 반드시 피드백 — 무음 실패 시 클립보드의 이전 내용(다른 바이어 견적일 수 있음)을 붙여넣는 사고 방지 (copyQuote와 동일 패턴)
  const ok=()=>{const b=$('mcb');if(b){b.textContent='✅ 복사됨';setTimeout(()=>b.textContent='📋 복사',1500);}};
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);ok();}catch(e){alert(t);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(fb);}else{fb();}
}
function buildLogPayload(l,me){
  return{
    fruit:(l.fr==='c'&&l.frName)?l.frName:(FRN[l.fr]||l.fr||''),country:l.co||'',flag:l.fl||'',spec:l.sp||'',   // 커스텀은 사용자가 입력한 아이템명이 시트 M열(과일)에 기록됨
    invoice:l.invoice||'',maker:l.maker||'',loadDate:l.loadDate||'',qty:l.qty||'',
    fxRate:l.rt||'',buyerPrice:(l.of!=null&&l.of!=='')?((l.sym||'$')+l.of):'',rawPrice:l.raw||'',
    margin:l.mb!=null?Number(l.mb).toFixed(2):'',totalMargin:l.tk!=null?Math.round(l.tk):'',
    sanji:l.sj||'',ship:l.sh||'',memo:l.me||'',timestamp:l.dt,
    author:me||l.author||'',id:l.id,
    marginStale:l._mstale?'1':''   // 수정에서 단가가 바뀌어 기존 마진이 무효 — 신 GAS가 J열을 비움 (구 GAS는 무시)
  };
}
// 전송 전 이상치 점검 — 실수 방지 (마이너스 마진 / 환율 괴리 / 실출고 초과 / 원물 미입력)
function sendGuard(l){
  const warns=[];
  if(l.mb!=null&&l.mb<0)warns.push('박스당 마진이 마이너스('+fD(l.mb)+(l.sym||'$')+')입니다');
  const refFx=(l.sym==='S$')?TODAY_SGD:TODAY_FX;
  const rtN=parseFloat(l.rt);
  if(refFx>0&&rtN>0&&Math.abs(rtN-refFx)/refFx>0.03)warns.push('적용환율(₩'+fN(rtN)+')이 오늘 시세(₩'+fN(refFx)+')와 '+(Math.abs(rtN-refFx)/refFx*100).toFixed(1)+'% 차이납니다');
  // 항공은 만적 개념이 없음(팔레트 단위 defTb) — 팔레트 초과 출고가 정상 사용이므로 이 검사는 해운만
  if(l.tb&&l.defTb&&+l.tb>+l.defTb&&!/air|항공/i.test(String(l.sh||'')))warns.push('실출고('+fN(l.tb)+'박스)가 만적('+fN(l.defTb)+'박스)을 초과합니다');
  if(/^0원/.test(String(l.raw||'')))warns.push('원물가가 0원입니다 — 원물 단가를 입력했는지 확인하세요 (마진이 과대 표시됨)');   // 전 과일 공통 (구: 포도 전용)
  const stH=syncStaleHours();if(stH)warns.push('시트 동기화가 '+stH+'시간 전입니다 — 운임·단가가 낡았을 수 있으니 동기화(⟳) 후 전송 권장');
  if(!warns.length)return true;
  return confirm('⚠ 전송 전 확인해주세요:\n\n· '+warns.join('\n· ')+'\n\n그래도 전송할까요?');
}
function cmSend(){
  if(!pnd)return;cmFill();
  const me=getMe();if(!me){alert('이름을 먼저 입력하세요');return;}
  if(!pnd.id)pnd.id=genId();
  pnd.author=me;
  if(!sendGuard(pnd))return;   // 이상치 경고에서 취소하면 전송 중단 (모달 유지)
  const btn=$('msbtn');btn.disabled=true;btn.textContent='⏳ 전송 중...';
  const isEdit=pnd._edit&&(pnd.sent||pnd._remote);   // 시트에 있는 기록만 update — 로컬 전용 기록의 수정은 신규 저장(log)
  const payload=buildLogPayload(pnd,me);
  const cb=jsonpCb('snd');
  const s=document.createElement('script');
  s.src=SU+'?action='+(isEdit?'update':'log')+'&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(payload));
  const myPnd=pnd;   // 응답 대기 중 모달이 닫히거나 다른 기록이 열려도(전역 pnd 변경) 이 전송 건을 정확히 처리
  const idleLbl=isEdit?'💾 수정 저장':'📤 시트 전송';
  // 전송 실패/타임아웃 시 신규 기록을 미전송 상태로 로컬 큐에 보관 — 모달을 닫거나 앱이 종료돼도 기록이 유실되지 않게 (GAS 멱등이라 늦은 성공+재전송도 중복 안전)
  function queueLocal(){if(isEdit)return;try{logs=logs.filter(l=>String(l.id)!==String(myPnd.id));logs.unshift({...myPnd});saveL();rL();}catch(e){}}
  const t=setTimeout(()=>{cl();queueLocal();btn.disabled=false;btn.textContent=isEdit?'⚠ 응답없음 — 저장 안 됨, 다시 시도':'⚠ 응답없음 — 기록탭에 미전송 보관됨';setTimeout(()=>{btn.textContent=idleLbl;btn.disabled=false;},3500);},20000);
  function cl(){clearTimeout(t);jsonpDone(cb,s);}
  s.onerror=function(){cl();queueLocal();btn.disabled=false;btn.textContent=isEdit?'❌ 연결실패 — 저장 안 됨, 다시 시도':'❌ 연결실패 — 기록탭에 미전송 보관됨';setTimeout(()=>btn.textContent=idleLbl,2500);};
  window[cb]=function(d){cl();
    if(d&&(d.ok||d.success)){
      myPnd.sent=true;myPnd.sentAt=new Date().toISOString();
      logs=logs.filter(l=>String(l.id)!==String(myPnd.id));   // 수정이든 재전송(dup)이든 같은 id의 옛 사본 제거
      logs.unshift({...myPnd});saveL();
      btn.textContent=isEdit?'✅ 수정 완료':(d.dup?'✅ 전송 확인됨':'✅ 전송 완료');
      const lb=$(myPnd.btn);if(lb){lb.classList.add('ok');setTimeout(()=>lb.classList.remove('ok'),1000);}
      setTimeout(()=>{if(pnd===myPnd)cmClose();fetchHist();},900);   // 그 사이 다른 모달이 열렸으면 닫지 않음
    } else {
      btn.disabled=false;btn.textContent='❌ '+(d&&d.error||'GAS 미지원');
      setTimeout(()=>btn.textContent=idleLbl,3000);
    }
  };
  document.head.appendChild(s);
}

let histLoading=false,_histSeq=0,histErrAt=null;
// ═══ 오늘 보낸 오퍼 요약 + 견적 복사 후 기록 누락 감지 ═══
function isToday(dt){const d=new Date(dt||0),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
const QC_KEY='hn_qc_v1';
// 견적 복사 시각 기록(당일분만 유지) — 복사만 하고 📝 기록을 빼먹은 국가를 기록탭에서 알려주기 위함
function recordQuoteCopy(cn){
  let a=[];try{a=JSON.parse(localStorage.getItem(QC_KEY)||'[]');if(!Array.isArray(a))a=[];}catch(e){a=[];}   // 파손 시 초기화 후 계속 — 조용한 영구 정지 방지
  try{a=a.filter(x=>x&&isToday(x.t));
    if(!a.some(x=>x.fr===F&&x.co===cn))a.push({fr:F,co:cn,t:Date.now()});
    localStorage.setItem(QC_KEY,JSON.stringify(a));}catch(e){}
}
function unloggedQuotes(){
  let a=[];try{a=JSON.parse(localStorage.getItem(QC_KEY)||'[]');if(!Array.isArray(a))a=[];}catch(e){a=[];}
  try{return a.filter(x=>x&&isToday(x.t)).filter(x=>!logs.some(l=>cano(l.co)===cano(x.co)&&(!l.fr||!x.fr||l.fr===x.fr)&&isToday(l.dt)));}catch(e){return[];}
}
// 오늘 기록한 오퍼를 국가별로 묶어 한눈에 — 하단 복사 버튼으로 보고용 텍스트 전달

  if(!fl.length){alert('오늘 기록된 오퍼가 없습니다');return;}
  const byCo={};fl.forEach(l=>{const k=l.co||'-';(byCo[k]=byCo[k]||[]).push(l);});
  const rows=[],txt=['📊 오늘 보낸 오퍼 '+fl.length+'건 ('+(new Date().getMonth()+1)+'/'+new Date().getDate()+')'];
  Object.keys(byCo).forEach(co=>{
    rows.push([hlEsc((byCo[co][0].fl?byCo[co][0].fl+' ':'')+co),byCo[co].length+'건','tot']);
    txt.push('');txt.push('■ '+co);

    b.onclick=()=>{const t2=txt.join('\n');const ok=()=>{b.textContent='✅ 복사됨';setTimeout(()=>{b.textContent='📋 요약 복사';},1500);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t2).then(ok).catch(()=>alert(t2));else alert(t2);};
    body.appendChild(b);}

function rL(){

    const idArg=l.id!=null?`decodeURIComponent('${jsArg(l.id)}')`:'null';

function fetchHist(){
  histLoading=true;rL();
  const mySeq=++_histSeq;   // 이중 실행 시 늦게 도착한 옛 응답이 최신 상태를 덮지 않도록
  const cb=jsonpCb('hst'),s=document.createElement('script');
  // 실패도 헤더에 표시 — 낡은 목록이 '새로고침된 것처럼' 보이지 않게. 단 stale 요청(재실행됨)의 실패는 무시 — 최신 성공 위에 거짓 실패 배너 방지
  const t=setTimeout(()=>{cl();if(mySeq!==_histSeq)return;histLoading=false;histErrAt=new Date();rL();},20000);
  function cl(){clearTimeout(t);jsonpDone(cb,s);}

function dL(id,remote,row,invEnc){

    const t=setTimeout(()=>{cl();alert('삭제 타임아웃');},15000);
    function cl(){clearTimeout(t);jsonpDone(cb,s);}
    s.onerror=function(){cl();alert('삭제 실패 (네트워크)');};
    window[cb]=function(d){cl();
      if(d&&d.ok){if(id)logs=logs.filter(l=>String(l.id)!==String(id));saveL();fetchHist();}
      else alert('삭제 실패: '+(d&&d.error||'알 수 없는 오류'));
    };
    let url=SU+'?action=delete&callback='+cb;
    // id가 있으면 id로만 삭제 — row를 같이 보내면 구버전 GAS가 id 미발견 시 행번호로 엉뚱한 기록을 지울 수 있음
    if(id)url+='&id='+encodeURIComponent(id);
    else if(row){url+='&row='+row;if(invEnc)url+='&inv='+invEnc;}   // 레거시 무ID 행만 행번호+인보이스 대조 삭제
    s.src=url;
    document.head.appendChild(s);
  } else {
    if(id==null){alert('기록을 특정할 수 없어 삭제하지 못했습니다. 새로고침 후 다시 시도해주세요.');return;}   // String(null)==='null' 매칭으로 엉뚱한 기록이 지워지는 것 방지 (loadL이 id를 백필하므로 정상 경로에선 발생 안 함)
    logs=logs.filter(l=>String(l.id)!==String(id));saveL();rL();
  }
}

let _rsBusy=false;
function resendAll(){
  if(_rsBusy)return;
  const me=getMe();if(!me){alert('이름을 먼저 입력하세요');return;}
  const pend=logs.filter(l=>!l.sent&&!l._remote&&l.id!=null);
  if(!pend.length)return;
  if(!confirm('미전송 기록 '+pend.length+'건을 시트로 전송할까요?'))return;
  _rsBusy=true;histLoading=true;rL();
  let i=0,ok=0,fail=0;
  (function next(){
    if(i>=pend.length){
      _rsBusy=false;histLoading=false;saveL();
      alert('전송 완료: '+ok+'건'+(fail?' · 실패 '+fail+'건 (미전송으로 남음 — 다시 시도 가능)':''));
      fetchHist();return;
    }
    const snap=pend[i++];
    // 진행 중 삭제/수정 반영 — 시작 시점 스냅샷이 아니라 현재 logs의 최신 객체를 전송. 삭제된 기록이 시트에 부활하거나 수정 전 옛 값이 올라가는 것 방지.
    const l=logs.find(x=>String(x.id)===String(snap.id)&&!x.sent&&!x._remote);
    if(!l){setTimeout(next,50);return;}
    const cb=jsonpCb('rsd'),sc=document.createElement('script');
    const t=setTimeout(()=>{cl();fail++;next();},15000);
    function cl(){clearTimeout(t);jsonpDone(cb,sc);}
    sc.onerror=function(){cl();fail++;setTimeout(next,300);};
    window[cb]=function(d){cl();
      if(d&&(d.ok||d.success)){l.sent=true;l.sentAt=new Date().toISOString();ok++;}
      else fail++;
      setTimeout(next,300);   // GAS 부하 방지 간격
    };
    sc.src=SU+'?action=log&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(buildLogPayload(l,me)));
    document.head.appendChild(sc);
  })();
}

// 연도 없는 "8/21" 같은 날짜 → 시즌 연도 추정 (오늘 기준 6개월 이상 미래면 작년으로)
function exYearFor(mo,day){
  const now=new Date(),y=now.getFullYear();
  const d=new Date(y,mo-1,day);
  if(d.getTime()-now.getTime()>183*86400000)return y-1; // 너무 미래면 작년
  return y;
}
function exDateObj(s){
  if(!s)return null;
  if(s instanceof Date)return s;
  const str=String(s).trim();
  if(/[>＞〉→]/.test(str))return null;   // 변경이력("8/21>23")은 단일 날짜 아님 → literal 표시 + exEffDate가 정렬용 처리
  let m=str.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=str.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]);}
  m=str.match(/^(\d{1,2})[.\-\/](\d{1,2})\s*$/);                    // M/D (연도 없음)
  if(m){const mo=+m[1],day=+m[2];if(mo>=1&&mo<=12&&day>=1&&day<=31)return new Date(exYearFor(mo,day),mo-1,day);}
  const d=new Date(str);return isNaN(d.getTime())?null:d;
}
function exFmtD(s){const d=exDateObj(s);if(!d)return s||'-';return(d.getMonth()+1)+'.'+d.getDate();}
// 변경이력 날짜("8/21>23>25" = 21→23→25로 변경)에서 최신(실제) 날짜 추출 — 정렬/그룹/필터용
function exEffDate(s){
  if(!s)return null;
  if(s instanceof Date)return s;
  const str=String(s).trim();
  if(!/[>＞〉→]/.test(str))return exDateObj(str);
  const parts=str.split(/[>＞〉→]/).map(p=>p.trim()).filter(Boolean);
  const base=exDateObj(parts[0]);
  if(!base)return exDateObj(str);
  let yr=base.getFullYear(),mo=base.getMonth(),day=base.getDate();
  for(let i=1;i<parts.length;i++){
    const md=parts[i].match(/^(\d{1,2})[.\-\/](\d{1,2})$/);     // "9/2" 월까지 변경
    if(md){mo=+md[1]-1;day=+md[2];yr=exYearFor(+md[1],+md[2]);continue;}
    const dd=parts[i].match(/^(\d{1,2})$/);                      // "23"=일만 변경
    // 일이 작아지면: 며칠(7일 이내) 앞당김은 같은 달("8/25>24"=8/24), 크게 작아지면 다음달("8/25>2"=9/2)
    if(dd&&+dd[1]>=1&&+dd[1]<=31){const nd=+dd[1];if(nd<day&&day-nd>7)mo++;day=nd;}
  }
  return new Date(yr,mo,day);   // mo가 12 넘어가면 JS가 다음해로 자동 보정
}

    let dh='<div class="elvDr">'+chips.map(c=>'<button class="elvDp '+(dm===c[0]?'on':'')+'" onclick="setExDate(\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div>';

  fl.sort((a,b)=>{

      if(vw!=='past'){if(dd===0)cls=' today';else if(dd===1)cls=' tmrw';}   // 오늘=빨강, 내일=주황 강조
    }

    return '<div class="exg"><div class="exgh'+cls+'"><span class="exghD">'+main+(wd?'<span class="wd">'+wd+'</span>':'')+'<span class="gcnt">'+grp[k].length+'건</span></span><span class="dday'+(vw==='past'?' past':'')+'">'+hdrR+'</span></div>'+grp[k].map(rowOf).join('')+'</div>';
  }).join('');
}
function exFmtQty(q){
  if(q==null||q==='')return '';
  const s=String(q).trim();
  // 순수 숫자면 천단위 콤마, 아니면 원문 그대로(예: "40피트","항공")
  if(/^[\d,]+(\.\d+)?$/.test(s)){const n=parseFloat(s.replace(/,/g,''));return isNaN(n)?s:n.toLocaleString('ko-KR');}
  return s;
}
// 국가명에 도시 붙어도(예: "인도네시아(자카르타)") 국기 찾기
function exFlag(ctry){
  if(!ctry)return '🏳️';
  if(EX_CFLG[ctry])return EX_CFLG[ctry];
  const base=String(ctry).replace(/[\(（].*$/,'').trim();
  if(EX_CFLG[base])return EX_CFLG[base];
  for(const k of Object.keys(EX_CFLG).sort((a,b)=>b.length-a.length)){if(String(ctry).startsWith(k))return EX_CFLG[k];}
  return '🏳️';
}

  const inv=exPick(r,'INVOICE','Invoice','인보이스');

  const dp=exPick(r,'출발일','ETD','출발'),ar=exPick(r,'도착일','ETA','도착');

  const dtxt=x=>{if(!x)return '·';if(exDateObj(x))return exFmtD(x);return esc(String(x));};   // 변경이력("8/21>23")은 원문 그대로
  const qs=String(qty||'');

  else if(/20\s*(피트|FT|ft)/.test(qs)||qs.trim()==='20')qcls=' ft20';
  else if(/1\s*P|항공|AIR/i.test(qs))qcls=' air';
  const key=jsArg(exRowKey(r));
  let btn='';
  if(vw==='up')btn='<button class="exrDn" onclick="exMarkDone(\''+key+'\',true)" title="지난 출고함으로 이동">✓ 완료</button>';
  else if(done&&!autoPast)btn='<button class="exrDn undo" onclick="exMarkDone(\''+key+'\',false)" title="예정 출고로 복원">↩ 예정</button>';
  return '<div class="exr">'+
    '<div class="exrIc">'+exFlag(ctry)+(fr?(EX_FE[fr]||'📦'):'')+'</div>'+
    '<div class="exrTx">'+
      '<div class="exrT1">'+(fr?'<span class="exrFr">'+esc(fr)+'</span>':'')+'<span class="exrC">'+esc(ctry)+'</span></div>'+
      '<div class="exrT2">'+
        (maker?'<span class="exrMk">🌱 '+esc(maker)+'</span>':'<span class="exrMk none">🌱 산지·제조자 미정</span>')+
        (buyer?'<span class="exrBy">'+esc(buyer)+'</span>':'')+
        (inv?'<span class="inv-wrap exrInv"><span class="inv-txt">'+esc(inv)+'</span><button class="elvCpy exrCp" onclick="exCopyInv(this)" title="인보이스 복사">📋</button></span>':'')+
      '</div>'+
      '<div class="exrT3">'+
        '<span class="exrTl">🚢출발 <b>'+dtxt(dp)+'</b> › 📍도착 <b>'+dtxt(ar)+'</b></span>'+
        (fwd?'<span>🚛'+esc(fwd)+'</span>':'')+
        (note?'<span>📌'+esc(note)+'</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="exrSide"><span class="exrQ'+qcls+'">'+(qs?esc(qs):'—')+'</span>'+btn+'</div>'+
  '</div>';
}

      '<div class="elvMi">'+
        '<div class="elvMr">'+hlCell('제조자',r.maker)+hlCell('상차일',r.loadDate?fmtKDate(r.loadDate):'')+'</div>'+
        '<div class="elvMr">'+hlCell('수량',r.qty)+hlCell('바이어단가',r.bp)+'</div>'+
        '<div class="elvMr">'+hlCell('산지단가',r.raw)+hlCell('적용환율',r.fx)+'</div>'+
      '</div>'+
      (r.memo?'<div class="elvNote"><span class="elvNi">📌</span><span>'+hlEsc(r.memo)+'</span></div>':'')+
    '</div>';
  }).join('');
}

// ═══════════ PWA Service Worker ═══════════
let deferredPrompt=null;
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{scope:'./'})
      .then(reg=>{
        console.log('[PWA] SW registered',reg.scope);
        if(reg.update)reg.update();
        // 1시간마다 업데이트 체크
        setInterval(()=>reg.update().catch(()=>{}),3600000);
      })
      .catch(err=>console.warn('[PWA] SW failed',err));
  });
  // 새 버전 SW 활성화 시 알림 — 열어둔 화면이 구버전으로 계속 돌지 않게.
  // (1) 최초 설치의 controllerchange는 업데이트가 아니므로 무시
  // (2) 페이지 로드 직후 10초 내 교체도 무시 — index.html은 network-first라 이미 최신 코드인데 매 배포 첫 실행마다 무의미한 토스트가 뜨던 오탐 방지
  // (3) 자동 소멸/1회 잠금 제거 — 토스트를 놓치면 세션 내내 구버전으로 도는 문제 방지 (수동 닫기 버튼 제공, 다음 배포에도 재표시)
  let _swHadCtrl=!!navigator.serviceWorker.controller;
  const _swBootAt=Date.now();
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!_swHadCtrl){_swHadCtrl=true;return;}
    if(!navigator.serviceWorker.controller)return;
    if(Date.now()-_swBootAt<10000)return;
    if(document.getElementById('uptoast'))return;
    const tst=document.createElement('div');tst.id='uptoast';tst.className='uptoast';
    tst.innerHTML='🔄 새 버전이 준비되었습니다 <button onclick="location.reload()">새로고침</button> <button onclick="this.parentNode.remove()" style="opacity:.7">나중에</button>';
    document.body.appendChild(tst);
  });
}
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const dismissed=localStorage.getItem('pwa_dismissed');
  if(!dismissed)setTimeout(showInstallBanner,3000);
});
function showInstallBanner(){
  if(!deferredPrompt||document.getElementById('pwabanner'))return;
  const b=document.createElement('div');b.id='pwabanner';b.className='pwabanner';
  b.innerHTML=`<div class="pwIcon">💰</div><div class="pwTxt"><b>홈 화면에 설치</b>매번 주소 입력 없이 앱처럼 사용하세요</div><button onclick="pwaInstall()">설치</button><button class="pwX" onclick="pwaDismiss()">×</button>`;
  document.body.appendChild(b);
}
function pwaInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(c=>{
    if(c.outcome==='accepted')console.log('[PWA] installed');
    deferredPrompt=null;
    pwaDismiss();
  });
}
function pwaDismiss(){
  const b=document.getElementById('pwabanner');if(b)b.remove();
  localStorage.setItem('pwa_dismissed','1');
}
window.addEventListener('appinstalled',()=>{console.log('[PWA] app installed');pwaDismiss();});

// 푸시 알림 권한 (선택적)
function reqNotif(){
  if(!('Notification' in window))return alert('알림 미지원');
  Notification.requestPermission().then(p=>{
    alert(p==='granted'?'알림 허용됨':'알림 거부됨');
  });
}


// ═══════════ 입력 검증 ═══════════
function chkReq(ids){
  let ok=true;
  ids.forEach(id=>{
    const e=$(id);if(!e)return;
    if(!e.value||+e.value===0){
      e.classList.add('req-empty');
      e.addEventListener('input',function f(){e.classList.remove('req-empty');e.removeEventListener('input',f);},{once:true});
      ok=false;
    }
  });
  return ok;
}
