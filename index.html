function sCalc(k,i){
  const p0=gv('sp0'),p1=gv('sp1'),fx=gv('sfx'),sg=gv('ssg'),of=gv('so'+k+i),sp=SS[i],fd=SF[k];

  const rt=fd.sg?sg:fx,mb=of-cif/rt,tk=mb*rt*sp.ct;
  return{of,mb,tk,cif,rt,sp,fd,sym:fd.sg?'S$':'$'};
}
function sR(k,i){
  const r=sCalc(k,i);const e1=$('sm'+k+i),e2=$('sk'+k+i);

  if(e2)e2.innerHTML=`<span class="${cl}">${fK(r.tk)}</span>`;
}
function sA(){Object.keys(SF).forEach(k=>SS.forEach((_,i)=>sR(k,i)));}
function sL(k,i){

}

function pCalc(cn,sid){
  if(!pSj)return null;
  const fx=gv('pfx'),sup=gv('psp'),sh=gv('psh')==40?'f':'t';
  const sp=PS.find(s=>s.id===sid);const co=PC.find(c=>c.n===cn);if(!sp||!co)return null;
  const of=gv('po'+cn+sid);if(!of)return null;
  const sea=PSEA[cn],il=PIL[pSj];if(!sea||!il)return null;
  const seaV=sea[sh],inlV=il[sh];if(!seaV)return null;
  const ctn=sh==='f'?sp.c4:sp.c2;if(!ctn)return null;
  const tp=sh==='f'?20:9,tb=ctn*tp;

  const p={a:gv('pa'),b:gv('pb'),c:gv('pc')};
  const h={a:gv('ha'),b:gv('hb'),c:gv('hc')};
  const wc={ua:5500,ub:8500}; // 미국 화지/3팩 스티커미부착

  let raw,wk;
  if(co.us&&sp.urf){raw=sp.urf(h,p);wk=sp.uwk(raw,wc);}
  else{raw=sp.rf(p);wk=gv('pwk_'+sp.wk)||PWK[sp.wk]||0;}

  const pbf=(inlV+seaV)/tp/ctn;
  const cif=raw+wk+sp.bj+sp.bx+pbf;
  const mb=of-(cif/fx),tk=mb*tb*fx+tb*sp.nw*sup;
  return{of,mb,tk,cif,tb,raw,wk,sp:sp.l};
}
function pR(cn,sid){const r=pCalc(cn,sid);const e1=$('pm'+cn+sid),e2=$('pt'+cn+sid),ew=$('pw'+cn+sid);if(!r){if(e1)e1.textContent='-';if(e2)e2.textContent='-';return;}const cl=mC(r.mb);if(e1)e1.innerHTML=`<span class="${cl}">${fD(r.mb)}</span>`;if(e2)e2.innerHTML=`<span class="${cl}">${fK(r.tk)}</span>`;if(ew)ew.textContent=fN(r.wk);}
function pA(){PC.forEach(c=>PS.forEach(s=>pR(c.n,s.id)));}
function pL(cn,sid){const r=pCalc(cn,sid);if(!r)return;const co=PC.find(c=>c.n===cn);

function uLC(){const e=$('lc');if(e)e.textContent=logs.filter(l=>l.fr===F).length;}
function cmOpen(d,sub,info){pnd={...d,id:Date.now(),dt:new Date().toISOString(),me:''};$('msb').textContent=sub;$('mif').innerHTML=info;$('mm').value='';$('mo').classList.remove('h');}
function cmClose(){$('mo').classList.add('h');pnd=null;}
function cmOk(){if(!pnd)return;pnd.me=$('mm').value.trim();logs.unshift(pnd);saveL();const b=$(pnd.btn);if(b){b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1000);}cmClose();rL();}
function cmCopy(){if(!pnd)return;const t=`${pnd.co} ${pnd.sp||''}\nOffer: ${pnd.sym}${pnd.of}\nMargin: ${fD(pnd.mb)}${pnd.sym}/box\nTotal: ${fK(pnd.tk)}${pnd.sj?' ('+pnd.sj+')':''}${pnd.sh?' '+pnd.sh:''}`;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>{const b=$('mcb');b.textContent='✅ 복사됨';setTimeout(()=>b.textContent='📋 복사',1500);}):alert(t);}
$('mo').addEventListener('click',function(e){if(e.target===this)cmClose();});

function rL(){
  const list=$('tl'),fl=logs.filter(l=>l.fr===F);uLC();
  if(!fl.length){list.innerHTML=`<div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;flex:1">오퍼 기록</span></div><div class="le"><span style="font-size:32px;display:block;margin-bottom:6px">📋</span>기록 없음</div>`;return;}
  let h=`<div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;flex:1">기록 (${fl.length})</span><button class="cb" onclick="cL()">전체삭제</button></div>`;
  fl.forEach(l=>{
    const d=new Date(l.dt),ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    h+=`<div class="li"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:16px">${l.fl}</span><div style="flex:1"><div style="font-size:11px;font-weight:700">${l.co}${l.sj?' · '+l.sj:''}${l.sh?' · '+l.sh:''}</div><div class="ld">${ds}</div>${l.me?`<div style="font-size:9px;color:var(--t2);font-style:italic;margin-top:1px">"${l.me}"</div>`:''}</div></div>
    <div class="lps"><div class="lp"><label>스펙</label><div class="v" style="font-size:9px">${l.sp}</div></div><div class="lp"><label>오퍼</label><div class="v">${l.sym}${l.of}</div></div><div class="lp"><label>마진</label><div class="v ${mC(l.mb)}">${fD(l.mb)}${l.sym}</div></div><div class="lp"><label>총마진</label><div class="v ${mC(l.tk)}">${fK(l.tk)}</div></div></div>
    <button class="ldb" onclick="dL(${l.id})">🗑</button></div>`;
  });list.innerHTML=h;
}
function dL(id){logs=logs.filter(l=>l.id!==id);saveL();rL();}
function cL(){if(!confirm('전부 삭제?'))return;logs=logs.filter(l=>l.fr!==F);saveL();rL();}

// ═══ SYNC ═══
const SU='https://script.google.com/macros/s/AKfycbyn1XNPzfZ_vrmf9Gh69HskO-1-dd7iEu6buS3GeUHiHgL9_VqlmMR1ipdtAe0_d2gc7Q/exec';
function doSy(){
  const b=$('hd').querySelector('.sb');b.textContent='⏳...';
  const cb='c'+Date.now(),s=document.createElement('script');s.src=SU+'?callback='+cb;
  const t=setTimeout(()=>{cl();b.textContent='❌ 타임아웃';console.error('[SYNC] timeout 10s');setTimeout(()=>b.textContent='🔄',4000);},10000);
  function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
  s.onerror=function(){cl();b.textContent='❌ 연결실패';console.error('[SYNC] script load failed');setTimeout(()=>b.textContent='🔄',4000);};

  // 키 유연 매핑 헬퍼
  function pk(o,...keys){for(const k of keys){if(o[k]!=null)return o[k];}return null;}
  function parseFT(o){if(!o||typeof o!=='object')return null;const f=pk(o,'f','full','forty','ft40','40');const t=pk(o,'t','twenty','ft20','20');if(f==null&&t==null)return null;return{f:f||0,t:t||0};}

  window[cb]=function(d){cl();try{
    console.log('[SYNC] received',JSON.stringify(d).substring(0,500));
    if(d.error){b.textContent='❌';console.error('[SYNC] server error:',d.error);setTimeout(()=>b.textContent='🔄',4000);return;}
    let cnt=0;

    // ── 환율 (모든 모드) ──
    const ex=pk(d,'exrate','rate','fx');
    if(ex){
      if(F==='s'&&$('sfx')){$('sfx').value=Math.round(ex);cnt++;}
      if(F==='p'&&$('pfx')){$('pfx').value=Math.round(ex);cnt++;}
      if(F==='g'&&$('gfx')){$('gfx').value=Math.round(ex);cnt++;}
    }

    // ── 딸기 단가 ──
    if(F==='s'&&d.prices){
      if(d.prices.p250)$('sp0').value=d.prices.p250;
      if(d.prices.p500_330)$('sp1').value=d.prices.p500_330;
      if(pk(d,'sgdrate','sgd'))$('ssg').value=Math.round(pk(d,'sgdrate','sgd'));
      cnt++;
    }

    // ── 딸기 항공 운임 ──
    const fr=pk(d,'freight','strawFreight','airFreight');
    if(fr)Object.keys(fr).forEach(k=>{
      if(!SF[k])return;const v=fr[k];
      const a=pk(v,'airKg','air','a','kg');if(a!=null){SF[k].a=a;cnt++;}
      const fc=pk(v,'fsc','fc','fuel');if(fc!=null)SF[k].fc=fc;
      const dom=pk(v,'domFreight','dom','d','domestic');if(dom!=null)SF[k].d=dom;
    });

    // ── 배 해운/내륙/작업비 ──
    const ps=pk(d,'pearSea','pSea','pearOcean');
    if(ps)Object.keys(ps).forEach(k=>{if(!PSEA[k])return;const r=parseFT(ps[k]);if(r){Object.assign(PSEA[k],r);cnt++;}});
    const pi=pk(d,'pearInland','pInland','pearDom');
    if(pi)Object.keys(pi).forEach(k=>{if(!PIL[k])return;const r=parseFT(pi[k]);if(r){Object.assign(PIL[k],r);cnt++;}});
    const pw=pk(d,'pearWk','pWk','pearWork');
    if(pw)Object.keys(pw).forEach(k=>{if(PWK[k]!=null){PWK[k]=pw[k];const e=$('pwk_'+k);if(e)e.value=pw[k];cnt++;}});

    // ── 포도 해운/내륙 ──
    const gs=pk(d,'grapeSea','gSea','grapeOcean');
    if(gs)Object.keys(gs).forEach(k=>{if(!GSEA[k])return;const r=parseFT(gs[k]);if(r){Object.assign(GSEA[k],r);cnt++;}});
    const gi=pk(d,'grapeInland','gInland','grapeDom');
    if(gi)Object.keys(gi).forEach(k=>{if(!GIL[k])return;const r=parseFT(gi[k]);if(r){Object.assign(GIL[k],r);cnt++;}});

    // ── 재계산 ──
    if(F==='s')sA();else if(F==='p'){pB();pA();}else if(F==='g')gA();

    console.log('[SYNC] applied',cnt,'items');
    b.textContent='✅';setTimeout(()=>b.textContent='🔄',3000);
    const st=$('syt');if(st){const now=new Date();st.textContent='· '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+' 동기화 ('+cnt+')';}
  }catch(e){console.error('[SYNC] parse error:',e);b.textContent='❌ 파싱오류';setTimeout(()=>b.textContent='🔄',4000);}};
  document.head.appendChild(s);
}

function testSync(){
  const r=$('testR');r.innerHTML='⏳ 연결 중...';
  const cb='test'+Date.now(),s=document.createElement('script');
  s.src=SU+'?callback='+cb;
  const t=setTimeout(()=>{cln();r.innerHTML='❌ <b>타임아웃</b> — GAS URL이 응답하지 않습니다.<br>확인사항:<br>1) Apps Script → 배포 → 접근: "모든 사용자"<br>2) URL이 /exec 로 끝나는지';},8000);
  s.onerror=function(){cln();r.innerHTML='❌ <b>스크립트 로드 실패</b> — URL을 확인하세요';};
  function cln(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
  window[cb]=function(d){cln();
    if(d.error){r.innerHTML='❌ GAS 에러: '+d.error;return;}
    const keys=Object.keys(d);
    let info='✅ <b>연동 성공!</b><br>';
    info+='환율: '+(d.exrate||'없음')+'<br>';
    info+='딸기단가: '+(d.prices?d.prices.p250+'원/kg':'없음')+'<br>';
    info+='딸기운임: '+(d.freight?Object.keys(d.freight).length+'개국':'없음')+'<br>';
    info+='배 해운: '+(d.pearSea?Object.keys(d.pearSea).length+'개국':'없음')+'<br>';
    info+='배 내륙: '+(d.pearInland?Object.keys(d.pearInland).length+'개 산지':'없음')+'<br>';
    info+='포도 해운: '+(d.grapeSea?Object.keys(d.grapeSea).length+'개국':'없음')+'<br>';
    info+='포도 내륙: '+(d.grapeInland?Object.keys(d.grapeInland).length+'개 산지':'없음');
    r.innerHTML=info;
  };
  document.head.appendChild(s);
}
</script>
