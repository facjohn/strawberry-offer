<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23d4a017'/%3E%3Cstop offset='100%25' stop-color='%238b6914'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='130' font-size='130' font-weight='900' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3E%24%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#f6f7fb;--sf:#fff;--sf2:#f1f3f8;--bd:#e2e5ee;--bd2:#cfd3df;--tx:#15172b;--t2:#5b6079;--t3:#9094a8;--gr:#16a368;--rd:#d63b3b;--yw:#d48a00;--bl:#3b6ff0;--ac:#3b6ff0;--sh:0 1px 2px rgba(20,25,55,.04),0 2px 8px rgba(20,25,55,.04);--sh2:0 4px 16px rgba(20,25,55,.08);--sh3:0 12px 40px rgba(20,25,55,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:13px;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.mpos{color:var(--gr)!important}.mneg{color:var(--rd)!important}.mmid{color:var(--yw)!important}
.mono{font-family:'JetBrains Mono',monospace}

#land{position:fixed;inset:0;background:radial-gradient(ellipse at top,#fff 0%,#eef1f8 60%,#e6eaf4 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#land.h{opacity:0;pointer-events:none}
#land::before{content:"";position:absolute;top:18%;left:50%;transform:translateX(-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(59,111,240,.08),transparent 70%);pointer-events:none;filter:blur(20px)}
.lt{font-size:24px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#1a1a2e,#3b6ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;z-index:1}
.ls{font-size:11px;color:var(--t2);margin-top:-6px;letter-spacing:.05em;font-weight:500;position:relative;z-index:1}
.fcs{display:flex;gap:14px;position:relative;z-index:1;margin-top:6px}
.fc{width:104px;height:122px;border-radius:20px;border:1px solid var(--bd);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s,border-color .2s;box-shadow:var(--sh)}
.fc:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--bd2)}
.fc:active{transform:translateY(-1px) scale(.97)}
.fc .e{font-size:42px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.08))}
.fc .n{font-size:13px;font-weight:700;color:var(--tx);letter-spacing:-.01em}

.hd{position:sticky;top:0;z-index:100;padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);background:var(--sf);box-shadow:0 1px 0 rgba(20,25,55,.02)}
.hd h1{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hd-s{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.05em;margin-top:1px}
.bb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.bb:hover{background:var(--sf2);color:var(--tx);border-color:var(--bd2)}
.bb:active{transform:scale(.94)}

.bs{padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
.ig{flex:1;min-width:64px}
.ig label{font-size:9px;font-weight:700;color:var(--t2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ig label em{font-style:normal;color:var(--ac);font-weight:800}
.ig input,.ig select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:6px 8px;border-radius:7px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
.ig input:hover,.ig select:hover{border-color:var(--bd2)}
.ig input:focus,.ig select:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}

.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{padding:10px 12px;font-size:11px;font-weight:600;color:var(--t2);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;letter-spacing:-.01em}
.tb:hover{color:var(--tx)}
.tb.a{color:var(--tx);border-bottom-color:var(--ac);font-weight:700}
.lc{display:inline-block;background:var(--ac);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:10px;margin-left:4px;vertical-align:middle;min-width:14px;text-align:center}

.tp{display:none;padding:12px 14px;flex-direction:column;gap:10px}
.tp.a{display:flex}
.sl{font-size:9px;color:var(--t3);padding:10px 14px 0;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.sjb{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.sj{padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;background:#fff;color:var(--t2);border:1px solid var(--bd);transition:all .18s}
.sj:hover{border-color:var(--bd2);color:var(--tx)}
.sj.a{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:transparent;font-weight:700}

.cc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.ch{padding:9px 12px;background:linear-gradient(180deg,var(--sf2),#fafbfd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:-.01em}
.sr{display:grid;grid-template-columns:1fr 78px 1fr 28px;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f2f7;transition:background .12s}
.sr:hover{background:#fafbfd}
.sr:last-of-type{border:none}
.slb{font-size:10px;font-weight:700;letter-spacing:-.01em}
.sbg{display:inline-block;font-size:7px;font-weight:800;padding:2px 5px;border-radius:4px;margin-left:3px;vertical-align:middle;letter-spacing:.02em}

.pi{width:60px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:5px;border-radius:6px;outline:none;text-align:center;transition:all .15s}
.pi:hover{border-color:var(--bd2)}
.pi:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}

.mv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right;letter-spacing:-.02em}
.mk{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;text-align:right;opacity:.85}

.lb{width:26px;height:26px;border-radius:6px;background:rgba(59,111,240,.07);border:1px solid rgba(59,111,240,.18);color:var(--bl);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.lb:hover{background:rgba(59,111,240,.13);transform:scale(1.05)}
.lb.ok{background:rgba(22,163,104,.15);border-color:var(--gr);color:var(--gr);animation:lp .35s cubic-bezier(.2,.9,.3,1.5)}
@keyframes lp{0%{transform:scale(1.4)}50%{transform:scale(.95)}100%{transform:scale(1)}}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
thead th{padding:8px 4px;text-align:center;font-size:9px;font-weight:800;color:var(--t2);background:linear-gradient(180deg,#f5f7fc,#eef1f8);border-bottom:1px solid var(--bd);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
tbody td{padding:6px 4px;border-bottom:1px solid #f1f3f8;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.ctd{font-weight:800;text-align:center;background:linear-gradient(180deg,#fdf8ee,#fbf3df)!important;border-right:1px solid #ead9a8;vertical-align:middle;font-size:10px;letter-spacing:-.01em}
.ptd input{width:60px;background:#fff;border:1px solid #d8c08c;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px;border-radius:5px;outline:none;text-align:center;transition:all .15s}
.ptd input:hover{border-color:#c4a866}
.ptd input:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(59,111,240,.15)}
.mc{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;padding-right:6px!important;letter-spacing:-.02em}
.tc{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;padding-right:6px!important;letter-spacing:-.01em}
.cs td{border-bottom:2px solid #e8d5a3!important}

.pp{border:1px solid #ead9a8;border-radius:11px;padding:10px;margin-bottom:6px;background:linear-gradient(135deg,#fdf6e3,#fbf0d4);box-shadow:var(--sh)}
.pp h3{font-size:11px;font-weight:800;margin-bottom:7px;color:#a17708;letter-spacing:-.01em}
.cv{background:#fff;border:1px solid #ead9a8;border-radius:8px;padding:8px;font-size:10px}
.cr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f4ecd4}
.cr:last-child{border:none}
.cvl{font-weight:700;font-family:'JetBrains Mono',monospace;color:#a17708}

.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.wg .ig input{font-size:10px;padding:5px 6px}

.mo{position:fixed;inset:0;background:rgba(15,18,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fdIn .2s ease}
.mo.h{display:none}
@keyframes fdIn{from{opacity:0}to{opacity:1}}
.ml{background:var(--sf);border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:var(--sh3);animation:slUp .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.ml h3{font-size:14px;font-weight:800;margin-bottom:3px;letter-spacing:-.02em}
.msb{font-size:11px;color:var(--t2);margin-bottom:10px}
.mif{background:var(--sf2);border-radius:8px;padding:9px 10px;font-size:10px;margin-bottom:10px;line-height:1.8;font-family:'JetBrains Mono',monospace;border:1px solid var(--bd)}
.mif span{color:var(--tx);font-weight:700}
.ml label{font-size:9px;color:var(--t2);font-weight:700;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ml textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:11px;padding:8px;border-radius:7px;outline:none;resize:none;height:56px;transition:all .15s}
.ml textarea:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}
.mbs{display:flex;gap:7px;margin-top:10px}
.mb{flex:1;padding:10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;font-family:inherit;transition:all .15s;letter-spacing:-.01em}
.mb:active{transform:scale(.97)}
.mb.c{background:#fff;border-color:var(--bd);color:var(--t2)}
.mb.c:hover{background:var(--sf2);color:var(--tx)}
.mb.k{background:linear-gradient(135deg,rgba(22,163,104,.12),rgba(22,163,104,.06));border-color:var(--gr);color:var(--gr)}
.mb.k:hover{background:rgba(22,163,104,.18)}

.le{text-align:center;padding:36px 20px;color:var(--t3);font-size:12px;line-height:2}
.li{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.li:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.ld{font-size:8px;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.lps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sf2);border-radius:7px;padding:7px 8px;margin-top:6px;border:1px solid var(--bd)}
.lp label{font-size:7px;color:var(--t3);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.lp .v{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:-.02em}
.ldb{background:#fff;border:1px solid var(--bd);color:var(--t2);font-size:9px;padding:3px 8px;border-radius:5px;cursor:pointer;margin-top:6px;transition:all .15s}
.ldb:hover{background:var(--sf2);color:var(--rd);border-color:var(--rd)}
.cb{background:#fff;border:1px solid var(--bd);color:var(--t2);font-size:10px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
.cb:hover{background:var(--sf2);color:var(--rd);border-color:var(--rd)}

.ig input.upd{border-color:var(--gr)!important;animation:flG .8s ease-out}
@keyframes flG{0%{background:rgba(22,163,104,.18);box-shadow:0 0 0 3px rgba(22,163,104,.15)}100%{background:var(--bg);box-shadow:none}}

.sbdg{font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid;font-family:'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap;margin-left:auto;transition:all .2s;letter-spacing:.02em}
.sbdg:hover{transform:scale(1.03)}
.sbdg.ok{color:var(--gr);border-color:var(--gr);background:rgba(22,163,104,.06)}
.sbdg.err{color:var(--rd);border-color:var(--rd);background:rgba(214,59,59,.06)}
.sbdg.idle{color:var(--t2);border-color:var(--bd);background:#fff}
.sbdg.ld{color:var(--yw);border-color:var(--yw);background:rgba(212,138,0,.06);animation:blk 1s infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.5}}
.lst{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace;text-align:right;margin-top:3px;letter-spacing:.02em}
.sgd-hint{font-size:9px;color:#c47d00;margin-top:4px;display:flex;align-items:center;gap:5px;font-weight:600}
.dot-sgd{width:6px;height:6px;border-radius:50%;background:#c47d00;animation:pls 2s infinite;flex-shrink:0;box-shadow:0 0 0 2px rgba(196,125,0,.2)}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

.pwo{position:fixed;inset:0;background:radial-gradient(ellipse at center,#fff 0%,#eef1f8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:30px}
.pwo.h{display:none}
.pwb{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:36px 30px;width:100%;max-width:310px;text-align:center;box-shadow:var(--sh3)}
.pwi{width:100%;background:var(--bg);border:2px solid var(--bd);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;padding:14px;border-radius:12px;outline:none;text-align:center;letter-spacing:8px;margin-bottom:14px;transition:all .15s}
.pwi:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(59,111,240,.12)}
.pwi.shake{animation:shk .35s ease-out}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pwbtn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#3b6ff0,#2855d4);border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:-.01em;box-shadow:0 4px 14px rgba(59,111,240,.3);transition:all .15s}
.pwbtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,111,240,.4)}
.pwbtn:active{transform:translateY(0) scale(.98)}
.mfg{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.mr{display:flex;gap:7px}
.mfi{flex:1;min-width:0}
.mfi label{font-size:9px;color:var(--t2);font-weight:700;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.mfi input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-size:11px;font-weight:600;padding:7px 8px;border-radius:6px;outline:none;font-family:inherit;transition:all .15s}
.mfi input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(59,111,240,.1)}
.mfi input.auto{background:#f7faff;border-color:#cfdcf5;color:#2855d4;font-family:'JetBrains Mono',monospace;font-size:10px}
.mb.s{background:linear-gradient(135deg,#3b6ff0,#2855d4);border-color:#2855d4;color:#fff;box-shadow:0 3px 12px rgba(59,111,240,.28)}
.mb.s:hover{box-shadow:0 5px 16px rgba(59,111,240,.4);transform:translateY(-1px)}
.mb.s:disabled{background:#c5cad8;border-color:#c5cad8;box-shadow:none;cursor:not-allowed;transform:none}
.mbs{flex-wrap:wrap}
.mbs .mb{flex:1 1 calc(50% - 4px);min-width:0}
.snt{display:inline-block;font-size:8px;font-weight:800;color:var(--gr);background:rgba(22,163,104,.12);border:1px solid var(--gr);padding:1px 6px;border-radius:8px;margin-left:5px;vertical-align:middle;letter-spacing:.04em}
.auth{display:inline-block;font-size:8px;font-weight:800;color:var(--t2);background:var(--sf2);border:1px solid var(--bd);padding:1px 6px;border-radius:8px;margin-left:5px;vertical-align:middle}
.auth.me{color:#fff;background:var(--ac);border-color:var(--ac)}
.li.mine{border-left:3px solid var(--ac);background:linear-gradient(90deg,rgba(59,111,240,.04),#fff 60%)}
.rgnb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:8px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh)}
.rgn{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;background:#fff;border:1.5px solid;font-family:inherit;transition:all .18s;letter-spacing:-.01em}
.rgn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.rgn.a{color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
</style>
</head>
<body>

<div class="pwo" id="pwo">
<div class="pwb">
<div style="font-size:48px;margin-bottom:12px">🔒</div>
<div style="font-size:18px;font-weight:900;margin-bottom:4px">현농프레쉬</div>
<div style="font-size:12px;color:var(--t2);margin-bottom:24px">오퍼 계산기 · by JOHN</div>
<input class="pwi" type="password" id="pwi" placeholder="****" maxlength="10" onkeydown="if(event.key==='Enter')chkPw()">
<button class="pwbtn" onclick="chkPw()">입장</button>
<div id="pwe" style="font-size:12px;color:var(--rd);margin-top:8px;height:16px"></div>
</div>
</div>

<div id="land" style="display:none"><div class="lt">현농프레쉬</div><div class="ls">오퍼 계산기 · by JOHN</div>

function pCalc(cn,sid){

  const seaV=sea[sh],inlV=il[sh];if(!seaV)return null;
  const ctn=sh==='f'?sp.c4:sp.c2;if(!ctn)return null;
  const tp=sh==='f'?20:9,tb=ctn*tp;

  const p={a:gv('pa'),b:gv('pb'),c:gv('pc')};
  const h={a:gv('ha'),b:gv('hb'),c:gv('hc')};
  const wc={u5:gv('puwk_u5')||PUWK.u5,u3:gv('puwk_u3')||PUWK.u3,u12:gv('puwk_u12')||PUWK.u12,u128:gv('puwk_u128')||PUWK.u128,u109:gv('puwk_u109')||PUWK.u109,udg:gv('puwk_udg')||PUWK.udg};

  let raw,wk;

  return{of,mb,tk,cif,tb,raw,wk,sp:sp.l};

function mCalc(cn,si){
  if(!mSj[F])return null;

  const seaV=sea[sh];if(!seaV)return null;

  const pbf=seaV/tp/ct;
  const cif=raw+wk+pbf;
  const mb=of-(cif/fx),tk=mb*tb*fx+tb*nw*sup;
  return{of,raw,mb,tk,cif,tb};
}

function getMe(){let n=localStorage.getItem('cur_user')||'';if(!n){n=(prompt('내 이름을 입력하세요 (기록 작성자 표시용)','')||'').trim();if(n)localStorage.setItem('cur_user',n);}return n;}

function cmSend(){

  if(!pnd.id)pnd.id=genId();

  const isEdit=pnd._edit;
  const payload={
    fruit:FRN[pnd.fr]||pnd.fr,country:pnd.co,flag:pnd.fl||'',spec:pnd.sp||'',
    invoice:pnd.invoice||'',maker:pnd.maker||'',loadDate:pnd.loadDate||'',qty:pnd.qty||'',
    fxRate:pnd.rt||'',buyerPrice:(pnd.sym||'$')+pnd.of,rawPrice:pnd.raw||'',
    margin:Number(pnd.mb||0).toFixed(2),totalMargin:Math.round(pnd.tk||0),

    author:me,id:pnd.id
  };
  const cb='snd'+Date.now();
  const s=document.createElement('script');
  s.src=SU+'?action='+(isEdit?'update':'log')+'&callback='+cb+'&data='+encodeURIComponent(JSON.stringify(payload));
  const t=setTimeout(()=>{cl();btn.disabled=false;btn.textContent='❌ 타임아웃';setTimeout(()=>{btn.textContent='📤 시트 전송';btn.disabled=false;},2500);},12000);
  function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
  s.onerror=function(){cl();btn.disabled=false;btn.textContent='❌ 연결실패';setTimeout(()=>btn.textContent='📤 시트 전송',2500);};
  window[cb]=function(d){cl();
    if(d&&(d.ok||d.success)){
      pnd.sent=true;pnd.sentAt=new Date().toISOString();
      if(isEdit){logs=logs.filter(l=>l.id!==pnd.id);}
      logs.unshift({...pnd});saveL();
      btn.textContent=isEdit?'✅ 수정 완료':'✅ 전송 완료';
      const lb=$(pnd.btn);if(lb){lb.classList.add('ok');setTimeout(()=>lb.classList.remove('ok'),1000);}
      setTimeout(()=>{cmClose();fetchHist();},900);
    } else {
      btn.disabled=false;btn.textContent='❌ '+(d&&d.error||'GAS 미지원');
      setTimeout(()=>btn.textContent='📤 시트 전송',3000);
    }
  };
  document.head.appendChild(s);
}

let histLoading=false;

    <div class="lps"><div class="lp"><label>스펙</label><div class="v" style="font-size:9px">${l.sp||'-'}</div></div><div class="lp"><label>오퍼</label><div class="v">${l.of?(l.sym||'')+l.of:'-'}</div></div><div class="lp"><label>마진</label><div class="v ${l.mb!=null?mC(l.mb):''}">${l.mb!=null?fD(l.mb)+(l.sym||''):'-'}</div></div><div class="lp"><label>총마진</label><div class="v ${l.tk!=null?mC(l.tk):''}">${l.tk!=null?fK(l.tk):'-'}</div></div></div>
    <div style="display:flex;gap:5px;margin-top:5px">${l.id?`<button class="ldb" style="background:#fff;color:var(--bl);border-color:#cfdcf5" onclick="editLog('${l.id}')">✏️ 수정</button>`:''}<button class="ldb" onclick="dL(${idAttr},${isRemote?true:false},${rowAttr})">🗑 삭제</button></div></div>`;
  });list.innerHTML=h;

function fetchHist(){
  histLoading=true;rL();
  const cb='hst'+Date.now(),s=document.createElement('script');
  const t=setTimeout(()=>{cl();histLoading=false;rL();},20000);
  function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
  s.onerror=function(){cl();histLoading=false;rL();};
  window[cb]=function(d){cl();histLoading=false;
    if(d&&d.ok&&d.rows){
      const sheetLogs=d.rows.map(r=>({
        id:r.id,_row:r.rowNum,fr:F,co:r.invoice||'-',fl:'',sj:'',sh:'',sp:'',
        of:'',sym:'',mb:null,tk:null,
        invoice:r.invoice,maker:r.maker,loadDate:r.loadDate,qty:r.qty,
        rt:r.fxRate,raw:r.rawPrice,me:r.memo,author:r.author,
        dt:r.date,sent:true,_remote:true
      }));
      const localOnly=logs.filter(l=>!l.id);
      logs=[...sheetLogs,...localOnly];saveL();
    }
    rL();
  };
  s.src=SU+'?action=history&callback='+cb;
  document.head.appendChild(s);
}
function editLog(id){
  const l=logs.find(x=>x.id===id);if(!l)return;
  pnd={...l,_edit:true};
  $('msb').textContent='✏️ 기록 수정';
  $('mif').innerHTML=`ID: <span>${id}</span> · 작성자: <span>${l.author||'-'}</span>`;
  $('mm').value=l.me||'';
  $('finv').value=l.invoice||'';
  $('fmkr').value=l.maker||'';
  $('fld').value=l.loadDate||'';
  $('fqty').value=l.qty||'';
  $('ffx').value=l.rt||'';
  $('fraw').value=l.raw||'';
  $('mo').classList.remove('h');
  const b=$('msbtn');b.disabled=false;b.textContent='💾 수정 저장';
}
function dL(id,remote,row){
  if(!confirm('이 기록을 삭제하시겠습니까?'))return;
  if(remote&&(id||row)){
    const cb='del'+Date.now(),s=document.createElement('script');
    const t=setTimeout(()=>{cl();alert('삭제 타임아웃');},15000);
    function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
    s.onerror=function(){cl();alert('삭제 실패 (네트워크)');};
    window[cb]=function(d){cl();
      if(d&&d.ok){if(id)logs=logs.filter(l=>l.id!==id);saveL();fetchHist();}
      else alert('삭제 실패: '+(d&&d.error||'알 수 없는 오류'));
    };
    let url=SU+'?action=delete&callback='+cb;
    if(id)url+='&id='+encodeURIComponent(id);
    if(row)url+='&row='+row;
    s.src=url;
    document.head.appendChild(s);
  } else {
    logs=logs.filter(l=>l.id!==id);saveL();rL();
  }
}

const SU='https://script.google.com/macros/s/AKfycbyn1XNPzfZ_vrmf9Gh69HskO-1-dd7iEu6buS3GeUHiHgL9_VqlmMR1ipdtAe0_d2gc7Q/exec';
function flI(id){const e=$(id);if(!e)return;e.classList.remove('upd');void e.offsetWidth;e.classList.add('upd');setTimeout(()=>e.classList.remove('upd'),700);}
function doSy(){
  const bg=$('sbdg');if(bg){bg.className='sbdg ld';bg.textContent='⏳ 동기화 중...';}
  const cb='c'+Date.now(),s=document.createElement('script');s.src=SU+'?callback='+cb;
  const t=setTimeout(()=>{cl();sBdg('err','❌ 타임아웃');},30000);
  function cl(){clearTimeout(t);if(s.parentNode)s.parentNode.removeChild(s);delete window[cb];}
  s.onerror=function(){cl();sBdg('err','❌ 연결실패');};
  function pk(o,...keys){for(const k of keys){if(o[k]!=null)return o[k];}return null;}
  function parseFT(o){if(!o||typeof o!=='object')return null;const f=pk(o,'f','full','forty','ft40','40');const t=pk(o,'t','twenty','ft20','20');if(f==null&&t==null)return null;const r={};if(f!=null)r.f=f;if(t!=null)r.t=t;return r;}
  window[cb]=function(d){cl();try{
    console.log('[SYNC]',JSON.stringify(d).substring(0,500));
    if(d.error){sBdg('err','❌ '+d.error);return;}
    let cnt=0;
    const ex=pk(d,'exrate','rate','fx');
    if(ex){
      if(F==='s'&&$('sfx')){$('sfx').value=Math.round(ex);flI('sfx');cnt++;}
      if(F==='p'&&$('pfx')){$('pfx').value=Math.round(ex);flI('pfx');cnt++;}
      if(F==='g'&&$('gfx')){$('gfx').value=Math.round(ex);flI('gfx');cnt++;}
    }
    if(F==='s'&&d.prices){
      if(d.prices.p250){$('sp0').value=d.prices.p250;flI('sp0');}
      if(d.prices.p500_330){$('sp1').value=d.prices.p500_330;flI('sp1');}
      if(pk(d,'sgdrate','sgd')){$('ssg').value=Math.round(pk(d,'sgdrate','sgd'));flI('ssg');}
      cnt++;
    }
    // 배 단가 (한국 + 미국)
    const pp=pk(d,'pearPrice','pPrice','pearPrices');
    if(pp){
      const map={a:'pa',b:'pb',c:'pc',ha:'ha',hb:'hb',hc:'hc'};
      Object.keys(map).forEach(k=>{const v=pk(pp,k);if(v!=null&&$(map[k])){$(map[k]).value=v;flI(map[k]);cnt++;}});
    }
    // 미국 작업비
    const puw=pk(d,'pearUWk','pUWk','usWk');
    if(puw)Object.keys(puw).forEach(k=>{if(PUWK[k]!=null){PUWK[k]=puw[k];const e=$('puwk_'+k);if(e)e.value=puw[k];cnt++;}});
    // 포도 기본단가 ₩/kg
    const gpr=pk(d,'grapePrice','gPrice','grapeKg');
    if(gpr!=null&&$('gp1')){$('gp1').value=gpr;flI('gp1');cnt++;}
    // 포도 작업비
    const gw=pk(d,'grapeWk','gWk');
    if(gw!=null&&$('gwk')){$('gwk').value=gw;flI('gwk');cnt++;}
    const fr=pk(d,'freight','strawFreight','airFreight');
    if(fr)Object.keys(fr).forEach(k=>{if(!SF[k])return;const v=fr[k];const a=pk(v,'airKg','air','a','kg');if(a!=null){SF[k].a=a;cnt++;}const fc=pk(v,'fsc','fc','fuel');if(fc!=null)SF[k].fc=fc;const dom=pk(v,'domFreight','dom','d','domestic');if(dom!=null)SF[k].d=dom;});
    const ps=pk(d,'pearSea','pSea');if(ps)Object.keys(ps).forEach(k=>{if(!PSEA[k])return;const r=parseFT(ps[k]);if(r){Object.assign(PSEA[k],r);cnt++;}});
    const pi=pk(d,'pearInland','pInland');if(pi)Object.keys(pi).forEach(k=>{if(!PIL[k])return;const r=parseFT(pi[k]);if(r){Object.assign(PIL[k],r);cnt++;}});
    const pw=pk(d,'pearWk','pWk');if(pw)Object.keys(pw).forEach(k=>{if(PWK[k]!=null){PWK[k]=pw[k];const e=$('pwk_'+k);if(e)e.value=pw[k];cnt++;}});
    const gs=pk(d,'grapeSea','gSea');if(gs)Object.keys(gs).forEach(k=>{if(!GSEA[k])return;const r=parseFT(gs[k]);if(r){Object.assign(GSEA[k],r);cnt++;}});
    const gi=pk(d,'grapeInland','gInland');if(gi)Object.keys(gi).forEach(k=>{if(!GIL[k])return;const r=parseFT(gi[k]);if(r){Object.assign(GIL[k],r);cnt++;}});
    if(F==='s')sA();else if(F==='p'){pB();pA();}else if(F==='g')gA();else mA();
    sBdg('ok','✅ 시트 연동 중');
    const now=new Date();const ts=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const lt=$('lst');if(lt)lt.textContent='마지막 동기화: '+ts;
  }catch(e){console.error('[SYNC]',e);sBdg('err','❌ 오류');}};
  document.head.appendChild(s);
}
function sBdg(cls,txt){const e=$('sbdg');if(e){e.className='sbdg '+cls;e.textContent=txt;}}

function testSync(){
  const r=$('testR');r.innerHTML='⏳ 연결 중...';
  const cb='test'+Date.now(),s=document.createElement('script');
  s.src=SU+'?callback='+cb;

  s.onerror=function(){cln();r.innerHTML='❌ <b>스크립트 로드 실패</b> — URL을 확인하세요';};

  window[cb]=function(d){cln();

    info+='배 해운: '+(d.pearSea?Object.keys(d.pearSea).length+'개국':'없음')+'<br>';
    info+='배 내륙: '+(d.pearInland?Object.keys(d.pearInland).length+'개 산지':'없음')+'<br>';
    info+='포도 해운: '+(d.grapeSea?Object.keys(d.grapeSea).length+'개국':'없음')+'<br>';
    info+='포도 내륙: '+(d.grapeInland?Object.keys(d.grapeInland).length+'개 산지':'없음');
    r.innerHTML=info;
  };
  document.head.appendChild(s);
}
